}

function playStation(st,index){
  if(!st)return;
  if(currentStation&&currentStation.name===st.name&&currentStation._group===st._group&&currentStation._idx===st._idx){
    if(isPlaying)audio.pause();
    else{resumeAudioCtx();if(!audio.src||audio.paused){startPlayback(st,index);}else audio.play().catch(()=>startPlayback(st,index));}
    return;
  }
  startPlayback(st,index);
}
function startPlayback(st,index){cleanup();retryCount=0;stallTicks=0;vuWarmup=0;agcLocked=false;agcLockT=0;specPeak=AGC_FLOOR;playToken++;const tk=playToken;currentStation=st;currentUrlIdx=0;displayName.textContent=st.name;displayStatus.textContent="TUNING...";playBtn.classList.add("loading");
  // 更新指针位置：官方源按组内索引，其他源用名称哈希做稳定偏移
  // 修复：index 无效(-1/undefined)时按名称解析；刻度长度按当前来源取，避免错位
  const navList=BOOK_FLAT;
  const t=navList.length;
  let pct;
  let idx=(typeof index==="number"&&index>=0)?index:findStationIndex(navList);
  if(idx>=0&&t>1){pct=(idx/(t-1))*100;}
  else{pct=(Math.abs(hashCode(st.name))%100);}
  dialPointer.style.left=`${20+pct*0.6}%`;
  cassetteDeck.classList.remove("playing");counterDigits.textContent="OFF";renderStationList();tryNextUrl(tk);}
function hashCode(str){let h=0;for(let i=0;i<str.length;i++){h=((h<<5)-h+str.charCodeAt(i))|0;}return h;}
function tryNextUrl(tk){
  const st=currentStation;if(!st){return;}
  if(currentUrlIdx>=st.urls.length){playBtn.classList.remove("loading");isPlaying=false;displayStatus.textContent="NO SIGNAL";updatePlayIcon();cassetteDeck.classList.remove("playing");counterDigits.textContent="OFF";return;}
  const url=st.urls[currentUrlIdx];displayStatus.textContent=`TUNING (${currentUrlIdx+1}/${st.urls.length})`;
  if(hls){hls.destroy();hls=null;}clearTimeout(switchTimer);
  switchTimer=setTimeout(()=>{if(tk===playToken&&!isPlaying){markDead(url);currentUrlIdx++;tryNextUrl(tk);}},8000);
  const isHls=/\.m3u8(\?|$)/i.test(url);
  // 策略 A：带 crossorigin 的直接交给 Hls.js / 原生播放器。
  // 这些 CDN（央广 ngcdn / CRI sk.cri.cn 等）虽然不返回 Access-Control-Allow-Origin，
  // 但只对带 Origin 头的请求做校验；不带 Origin 时服务端会放行并返回真实音频数据。
  // 浏览器播放器在发起请求时不会自动加 Origin，因此裸 audio.src 通常能直接播放。
  if(isHls&&window.Hls&&window.Hls.isSupported()){
    try{hls=new window.Hls({maxBufferLength:10,manifestLoadingTimeOut:6000,manifestLoadingMaxRetry:1,levelLoadingTimeOut:8000,levelLoadingMaxRetry:1});
      hls.on(window.Hls.Events.MANIFEST_PARSED,()=>{if(tk===playToken)audio.play().catch(()=>{});});
      hls.on(window.Hls.Events.ERROR,(e,d)=>{
        if(tk!==playToken)return;
        // 网络/CORS 拦截时降级为 fetch 取流后本地解封装。
        // 修复：原判断用 hls.loader.error —— hls.js 实例没有 .loader 属性，条件恒为 false，
        // 降级路径从未触发过。现改为：清单/分片加载类错误一律先试降级，失败自然进下一条源。
        if(d.details==="manifestLoadError"||d.details==="manifestLoadTimeOut"||d.details==="levelLoadError"||d.details==="levelLoadTimeOut"){
          return tryFetchAndPlay(url,tk);
        }
        if(!d.fatal)return;
        if(d.type===window.Hls.ErrorTypes.NETWORK_ERROR||d.type===window.Hls.ErrorTypes.OTHER_ERROR){markDead(url);currentUrlIdx++;tryNextUrl(tk);}
        else if(d.type===window.Hls.ErrorTypes.MEDIA_ERROR){try{hls.recoverMediaError();}catch(_){markDead(url);currentUrlIdx++;tryNextUrl(tk);}}
      });
      hls.loadSource(url);hls.attachMedia(audio);
    }catch(_){tryFetchAndPlay(url,tk);}
  }else if(isHls&&audio.canPlayType("application/vnd.apple.mpegurl")){audio.src=url;audio.play().catch(onPlayFail);}
  else{audio.src=url;audio.play().catch(onPlayFail);}
  // 浏览器自动播放策略拦截（NotAllowedError）时不要把源判死，
  // 否则会一路跳过所有候选源；只提示用户按播放键即可。
  function onPlayFail(e){
    if(tk!==playToken)return;
    if(e&&e.name==="NotAllowedError"){
      playBtn.classList.remove("loading");isPlaying=false;
      displayStatus.textContent="按 ▶ 开始播放";updatePlayIcon();return;
    }
    markDead(url);currentUrlIdx++;tryNextUrl(tk);
  }
}
// 当 CDN 因 CORS 拒绝 Hls.js 的带凭据请求时，用不带 Origin 的 fetch 拉到内存后解封装重播。
// 代价是失去自适应码率与 seek，但能绕过"名单正确却播不了"的死结。
async function tryFetchAndPlay(url,tk){
  const st=currentStation;if(!st||tk!==playToken)return;
  displayStatus.textContent=`代理拉流 (${currentUrlIdx+1}/${st.urls.length})`;
  try{
    // 8s 超时兑底，避免 fetch 挂起卡死换台流程
    const ac=new AbortController();
    const acTimer=setTimeout(()=>ac.abort(),8000);
    let text;
    try{
      const res=await fetch(url,{mode:"cors",cache:"no-store",signal:ac.signal});
      if(!res.ok)throw new Error("fetch "+res.status);
      text=await res.text();
    }finally{clearTimeout(acTimer);}
    if(tk!==playToken)return;
    // 修复：manifest 转 blob 后 hls.js 把相对分片路径按页面地址解析，导致分片 404 播不出。
    // 转 blob 前先把所有 URI 重写为绝对地址（以原 manifest URL 为基准）。
    let base=null;try{base=new URL(url,window.location.href);}catch(_){}
    const fixedText=base?text.split(/\r?\n/).map(line=>{
      const t=line.trim();
      if(!t)return line;
      if(t.charAt(0)==="#"){
        return line.replace(/URI="([^"]+)"/g,(m,u)=>{try{return 'URI="'+new URL(u,base).href+'"';}catch(_){return m;}});
      }
      try{return new URL(t,base).href;}catch(_){return line;}
    }).join("\n"):text;
    const blob=new Blob([fixedText],{type:"application/vnd.apple.mpegurl"});
    const objectUrl=URL.createObjectURL(blob);
    if(hls){try{hls.destroy();}catch(_){}hls=null;}
    const cleanupBlob=()=>{try{URL.revokeObjectURL(objectUrl);}catch(_){}};
    if(window.Hls&&window.Hls.isSupported()){
      try{
        hls=new window.Hls({maxBufferLength:10,manifestLoadingTimeOut:8000,manifestLoadingMaxRetry:2,levelLoadingTimeOut:8000,levelLoadingMaxRetry:2});
        hls.on(window.Hls.Events.MANIFEST_PARSED,()=>{if(tk===playToken)audio.play().catch(()=>{cleanupBlob();markDead(url);currentUrlIdx++;tryNextUrl(tk);});});
        hls.on(window.Hls.Events.ERROR,(e,d)=>{
          if(tk!==playToken)return;
          if(!d.fatal)return;
          cleanupBlob();
          if(d.type===window.Hls.ErrorTypes.NETWORK_ERROR||d.type===window.Hls.ErrorTypes.OTHER_ERROR){markDead(url);currentUrlIdx++;tryNextUrl(tk);}
          else if(d.type===window.Hls.ErrorTypes.MEDIA_ERROR){try{hls.recoverMediaError();}catch(_){markDead(url);currentUrlIdx++;tryNextUrl(tk);}}
        });
        hls.loadSource(objectUrl);hls.attachMedia(audio);
      }catch(_){cleanupBlob();markDead(url);currentUrlIdx++;tryNextUrl(tk);}
    }else{audio.src=objectUrl;audio.play().catch(()=>{cleanupBlob();markDead(url);currentUrlIdx++;tryNextUrl(tk);});}
  }catch(err){
    // fetch 同样被 CORS 拦下，进入下一条备用地址
    console.warn("[PANDA] fetch fallback failed:",url,err&&err.message);
    markDead(url);currentUrlIdx++;tryNextUrl(tk);
  }
}
// 指针"释放"：切台 / 停止时保留当前位置，交给机械回零慢慢摇回去。
// ★ 与旧版 resetVU 的区别：不再把 ballistics / needleAngle / needleVel 清零，
//   指针因此会先站住、再被游丝缓慢拉回零位（符合机械表头的物理特性）。
function releaseVU(){
  stopSpecLoop();
  rmsHistory.length=0;
  specLevel=0;specPeak=AGC_FLOOR;agcLocked=false;agcLockT=0;vuWarmup=0;
  enterFall(true);                 // 从"当前位置"重新起步回零
  try{vuMeter.classList.remove("active");}catch(_){}
}
// 硬归零：只在需要彻底复位的场合使用（页面中未调用，保留备用）
function resetVU(){
  stopSpecLoop();
  rmsHistory.length=0;
  ballistics=0;needleVel=0;needleAngle=VU_MIN_ANGLE;
  specLevel=0;specPeak=AGC_FLOOR;agcLocked=false;agcLockT=0;vuWarmup=0;
  peakHold=0;peakHoldTimer=0;vuFalling=false;fallT=0;fallFrom=VU_MIN_ANGLE;
  try{vuPeak.classList.remove("on");}catch(_){}
  try{vuMeter.classList.remove("active");}catch(_){}
  try{vuNeedle.style.transform=`rotate(${VU_MIN_ANGLE}deg)`;}catch(_){}
}
function cleanup(){
  isCleaningUp=true;
  isPlaying=false;                 // ★ 修复：切台时必须先置为未播放，否则指针会照旧摆动
  clearTimeout(switchTimer);switchTimer=null;
  if(hls){try{hls.destroy();}catch(_){}hls=null;}
  releaseVU();                     // ★ 指针保留当前位置，缓慢摇回零位
  try{audio.pause();}catch(_){}
  if(audio.src&&audio.src!==window.location.href){
    audio.removeAttribute("src");
    // 修复：不调 load() 时部分浏览器仍会继续播放旧流
    try{audio.load();}catch(_){}
  }
  setTimeout(()=>isCleaningUp=false,100);
}
function updatePlayIcon(){if(isPlaying)playIconSvg.innerHTML='<rect x="6" y="4" width="4" height="16"/><rect x="14" y="4" width="4" height="16"/>';else playIconSvg.innerHTML='<path d="M8 5v14l11-7z"/>';}

playBtn.addEventListener("click",()=>{resumeAudioCtx();if(!currentStation){const first=BOOK_FLAT[0];if(first){playStation(first,0);}else{openPackPanel();packMsgShow("电台簿是空的，先把源粘进来","err");}return;}if(isPlaying)audio.pause();else{if(!audio.src||audio.paused){startPlayback(currentStation,-1);}else audio.play().catch(()=>startPlayback(currentStation,-1));}});
cassetteDeck.addEventListener("click",()=>playBtn.click());
// 修复：currentStation 是点击时新建的临时对象，list.indexOf() 恒为 -1
// （旧行为：上一台永远跳到最后一台、下一台永远跳到第一台）。改为按名称定位。
function findStationIndex(list){
  if(!currentStation||!list)return -1;
  const i=list.indexOf(currentStation);
  if(i>=0)return i;
  return list.findIndex(s=>s&&s.name===currentStation.name);
}
function navStation(step){
  const list=BOOK_FLAT;

  if(i<0)i=0;
  const n=((i+step)%list.length+list.length)%list.length;
  const raw=list[n]; if(!raw)return;
  playStation(raw,n);
}

// ── 设计稿基准尺寸 ──
// 设计稿：900×400（宽×高）
// 全屏时以视口高宽比动态计算缩放比，让机身尽量占满可用空间
const RADIO_W=900, RADIO_H=400;
const FS_PADDING_V=56;   // 上下安全边距（px）
const FS_PADDING_H=64;   // 左右安全边距（px）

/**
 * 计算全屏缩放比
 * 策略：以视口高宽比判断方向
 *   - 16:9 或更宽：高度为主轴，机身高度吃满可用高度
 *   - 更窄（竖屏）：宽度为主轴，机身宽度吃满可用宽度
 * 缩放比上限受 DPR 影响，高 DPI 屏允许更大缩放而不失真
 */
function calcFSScale(){
  const w=window.innerWidth, h=window.innerHeight;
  const dpr=window.devicePixelRatio||1;

  // 可用空间
  const availW=Math.max(320,w-2*FS_PADDING_H);
  const availH=Math.max(200,h-2*FS_PADDING_V);

  // 以高度为主轴计算缩放
  let scaleByH=availH/RADIO_H;
  // 以宽度为主轴计算缩放
  let scaleByW=availW/RADIO_W;

  // 取较小值，保证不溢出
  let scale=Math.min(scaleByH,scaleByW);

  // 缩放区间：
  // 下限 0.6 — 保证小窗口也不至于小到看不清
  // 上限基于 DPR — 高 DPI 屏可放大更多而不模糊
  // 4K 屏 (DPR=1 但物理像素极高) 可放大约 4.5 倍
  // 普通 1080p (DPR=1) 约放大约 2.7 倍
  const minScale=0.6;
  const maxScaleByDPR=Math.min(5,Math.max(2.5,dpr*2.2));
  // 同时考虑视口尺寸上限
  const maxScaleByViewport=Math.max(1,Math.min(5,(w/1920)*2.4,(h/1080)*2.4));
  const maxScale=Math.min(maxScaleByDPR,maxScaleByViewport);

  scale=Math.max(minScale,Math.min(maxScale,scale));
  scale=Number(scale.toFixed(4));

  radioBox.style.setProperty("--fs-scale",String(scale));

  // 动态调整机身圆角，大屏时圆角更自然
  const scaledRadius=Math.round(24*scale);
  radioBox.style.borderRadius=scaledRadius+"px";

  return scale;
}

// ── 全屏 API 封装（Promise 化，便于与动画串时序） ────────────────
// 使用 document.documentElement 作为全屏目标（整个页面），
// 兼容性优于对单个元素调用，且工具栏固定在视口右上角不受 transform 影响。
function fsEl(){ return document.fullscreenElement||document.webkitFullscreenElement||document.msFullscreenElement; }
function hasFSAPI(){
  return !!(document.documentElement.requestFullscreen||document.documentElement.webkitRequestFullscreen||document.documentElement.msRequestFullscreen);
}
function reqFS(){
  const el=document.documentElement;
  const p = el.requestFullscreen ? el.requestFullscreen()
          : el.webkitRequestFullscreen ? el.webkitRequestFullscreen()
          : el.msRequestFullscreen ? el.msRequestFullscreen() : null;
  return (p&&typeof p.then==="function") ? p : Promise.resolve();
}
function exitFSAsync(){
  const p = document.exitFullscreen ? document.exitFullscreen()
          : document.webkitExitFullscreen ? document.webkitExitFullscreen()
          : document.msExitFullscreen ? document.msExitFullscreen() : null;
  return (p&&typeof p.then==="function") ? p : Promise.resolve();
}

// ── 状态落库（不含动画） ────────────────────────────────────────
// 只负责切 class / 算缩放比 / 换图标，不做任何过渡。
// 动画统一交给下面的 flipFS()，两者职责分离，避免"状态跳变 + 动画"打架。
function applyFSState(on){
  isFS = on;
  radioBox.classList.toggle("fullscreen", on);
  document.body.classList.toggle("fs-lock", on);
  if(on){
    calcFSScale();
    showToolbar();
    resetToolbarTimer();
  }else{
    radioBox.style.removeProperty("--fs-scale");
    hideToolbar();
  }
  fsIcon.innerHTML = on ? FS_EXIT : FS_ENTER;
  fsTip.textContent = on ? "退出全屏 (Esc)" : "全屏";
}

// ── 工具栏自动隐藏/呼出 ──────────────────────────────────────────
// 全屏时：鼠标不动 2.5s 后隐藏，移动时立即显示
let toolbarTimer=null;
function showToolbar(){
  if(!isFS) return;
  // 面板打开期间不再呼出工具栏（否则会盖住面板 ✕ 按钮）
  if(document.body.classList.contains("panel-open")) return;
  toolbar.classList.add("visible");
}
function hideToolbar(){
  toolbar.classList.remove("visible");
}
function resetToolbarTimer(){
  showToolbar();
  clearTimeout(toolbarTimer);
  toolbarTimer=setTimeout(hideToolbar,2500);
}
// 监听鼠标移动（全屏时）
document.addEventListener("mousemove",(e)=>{
  if(!isFS) return;
  // 鼠标在顶部区域或移动时显示工具栏
  if(e.clientY<80){
    showToolbar();
    clearTimeout(toolbarTimer);
    toolbarTimer=setTimeout(hideToolbar,2500);
  }else if(toolbar.classList.contains("visible")){
    // 已在显示状态且鼠标离开顶部区域，启动隐藏计时
    resetToolbarTimer();
  }
});
// 触摸设备：点击顶部区域切换工具栏
document.addEventListener("touchstart",(e)=>{
  if(!isFS) return;
  if(e.touches[0].clientY<100){
    if(toolbar.classList.contains("visible")){
      hideToolbar();
    }else{
      showToolbar();
      clearTimeout(toolbarTimer);
      toolbarTimer=setTimeout(hideToolbar,3000);
    }
  }
},{passive:true});

// ── 动画参数 ────────────────────────────────────────────────────
// 参照 Apple 官网 / Stripe / Vercel 这类"大容器形变"的通行做法：
//   · 缓动用 easeOutExpo —— 起步果断、尾段极长极柔（0.16,1 让开头几乎瞬间起步，
//     0.3,1 让收尾缓缓贴合）。比 Material 的 standard 曲线更"贵"，
//     这正是 Apple 产品页那种"被推出去又稳稳停住"的手感。
//   · 进入比退出略长：放大是"展开"需要铺陈，收回要利落。
const FS_DUR_IN=760, FS_DUR_OUT=620;
const FS_EASE_IN ="cubic-bezier(0.16, 1, 0.3, 1)";     // easeOutExpo
const FS_EASE_OUT="cubic-bezier(0.22, 0.78, 0.31, 1)"; // 略收敛的 expo，收回更干脆
const nextFrame=()=>new Promise(r=>requestAnimationFrame(()=>requestAnimationFrame(r)));
const reducedMotion=()=>window.matchMedia&&window.matchMedia("(prefers-reduced-motion: reduce)").matches;

let fsAnim=null;        // 当前过渡动画句柄
let fsBusy=false;       // 重入保护：连按按钮 / Esc+按钮并发时不会被打断

// ── FLIP 过渡 ───────────────────────────────────────────────────
// First  记录切换前的视觉矩形
// Last   落库新状态后记录最终视觉矩形
// Invert 算出一个"把最终状态映射回起始状态"的 transform
// Play   从这个 transform 动画回单位矩阵
// 全程是同一个真实 DOM 节点在动 —— 没有位图快照，也就没有先糊后清。
async function flipFS(on){
  // 等两帧：确保全屏切换后的视口尺寸 / 滚动条状态已经稳定
  await nextFrame();

  // ★ 先撤掉上一次过渡的残留：inline transform 会让 first 测到错误矩形
  if(fsAnim){ try{ fsAnim.cancel(); }catch(_){} fsAnim=null; }
  radioBox.style.transform = "";

  const first = radioBox.getBoundingClientRect();   // First
  document.body.classList.add("fs-animating");      // 抑制过渡期的滚动条抖动

  applyFSState(on);                                  // 落库新状态
  const last  = radioBox.getBoundingClientRect();    // Last

  // 未变换盒子的尺寸（offsetWidth/Height 不受 transform 影响）
  const W = radioBox.offsetWidth, H = radioBox.offsetHeight;
  // 最终 CSS 变换里的平移量：全屏态是 -50%/-50%，常态是 none
  const endTx = on ? -W/2 : 0, endTy = on ? -H/2 : 0;
  const endScale = on ? (parseFloat(radioBox.style.getPropertyValue("--fs-scale"))||1) : 1;
  // 未变换盒子中心在视口里的位置（由最终矩形反推）
  const c0x = last.left + last.width/2 - endTx;
  const c0y = last.top  + last.height/2 - endTy;

  // Invert：把最终状态缩回 First 的位置与大小
  const kx = first.width  / (W || 1);
  const ky = first.height / (H || 1);
  const ix = (first.left + first.width/2)  - c0x;
  const iy = (first.top  + first.height/2) - c0y;
  const from = `translate(${ix.toFixed(2)}px, ${iy.toFixed(2)}px) scale(${kx.toFixed(5)}, ${ky.toFixed(5)})`;
  const to   = on ? `translate(${endTx.toFixed(2)}px, ${endTy.toFixed(2)}px) scale(${endScale})` : "none";

  // 动画期间才提升为合成层；结束后立即撤掉，强制按最终比例重新栅格化 → 收尾是清晰的
  radioBox.style.willChange = "transform";

  if(reducedMotion()){
    radioBox.style.transform=""; radioBox.style.willChange="";
    document.body.classList.remove("fs-animating");
    return;
  }

  // 让背景光晕 / 阴影 / 工具栏与机身用同一时长同一曲线一起动
  const dur = on ? FS_DUR_IN : FS_DUR_OUT;
  document.documentElement.style.setProperty("--fs-dur", (dur/1000)+"s");
  document.documentElement.style.setProperty("--fs-ease", on ? FS_EASE_IN : FS_EASE_OUT);

  // ★ 先同步写入起始变换再 animate()。
  //   WAAPI 的 animate() 要等到下一个动画帧才生效，而 applyFSState() 已经
  //   把最终状态提交了 —— 中间若渲染一帧，用户就会看到"最终状态"闪现，
  //   这是 FLIP 最典型的坑。inline 写死 from 可以把这一帧也钉住。
  radioBox.style.transform = from;

  fsAnim = radioBox.animate(
    [{ transform: from }, { transform: to }],
    { duration: dur, easing: on ? FS_EASE_IN : FS_EASE_OUT, fill: "both" }
  );
  try{
    await fsAnim.finished;
  }catch(_){ /* 被 cancel（快速切换）→ 交给下一次过渡接管 */ }

  // ★ 收尾：先清 inline（此时动画 fill:both 仍覆盖着，视觉无变化），
  //   再 cancel 动画露出最终 CSS 状态 —— 两者数值相同，因此不会出现第二下闪。
  //   顺序反了会先闪回 from，务必保持。
  radioBox.style.transform = "";
  if(fsAnim){ try{ fsAnim.cancel(); }catch(_){} fsAnim = null; }
  radioBox.style.willChange="";      // 触发重新栅格化
  document.body.classList.remove("fs-animating");
  // ★ 全屏缩放后 canvas 的 CSS 尺寸变了但位图没重建 → 频谱会糊。
  //   缩放落定后按最终尺寸重建一次，4K 全屏下柱子边缘才锐利。
  try{ if(typeof resizeSpecCanvas==="function") resizeSpecCanvas(); }catch(_){}
}

// ── 对外切换入口 ────────────────────────────────────────────────
// 时序：先等浏览器把全屏切完（视口才是最终尺寸），再做 FLIP。
// 旧实现反过来 —— 先 startViewTransition 再等全屏事件，
// 于是滚动条消失、body padding 归零这些硬跳根本没被过渡覆盖。
async function toggleFS(want){
  if(fsBusy) return;
  fsBusy = true;
  try{
    if(hasFSAPI()){
      if(want) await reqFS(); else await exitFSAsync();
    }
    // API 不可用时降级为"伪全屏"：仅切 class，仍然走同一套 FLIP 动画
    await nextFrame();
    await flipFS(want);
    // ★ 动画期间用户按了 Esc 或点了浏览器原生全屏按钮 → 以真实状态为准再收敛一次
    if(fsNeedsSync){
      fsNeedsSync = false;
      const real = !!fsEl();
      if(real !== isFS) await flipFS(real);
    }
  }catch(_){
    // 全屏被拒绝（如非用户手势触发）→ 保证状态与视觉一致，不做动画
    const real = !!fsEl();
    if(real !== isFS) applyFSState(real);
  }finally{
    document.body.classList.remove("fs-animating");
    fsBusy = false;
  }
}

// ── 全屏切换事件监听 ────────────────────────────────────────────
// Esc / F11 / 浏览器自带的全屏按钮都会走到这里。
// 如果是我们自己发起的（fsBusy 中），状态由 flipFS 负责落库，这里直接跳过，
// 否则会把 final 状态提前应用掉，动画就没得可动了。
let fsNeedsSync=false;   // 过渡期间收到过全屏状态变化 → 结束后再收敛一次
function handleFSChange(){
  if(fsBusy){ fsNeedsSync=true; return; }   // 交由 toggleFS 收尾处理
  applyFSState(!!fsEl());
}
document.addEventListener("fullscreenchange",handleFSChange);
document.addEventListener("webkitfullscreenchange",handleFSChange);
document.addEventListener("MSFullscreenChange",handleFSChange);

// ── 按钮事件 ────────────────────────────────────────────────────
fullscreenBtn.addEventListener("click",()=>{ toggleFS(!isFS); });

// ── 键盘快捷键 ──
document.addEventListener("keydown",(e)=>{
  // Esc：先关确认弹窗/面板，再交还浏览器处理全屏退出
  if(e.key==="Escape"){
    if(confirmMask.classList.contains("show")){closeConfirm();return;}
    if(sidePanel.classList.contains("open")){closePanel();}
  }
  if(e.key==="Escape"&&isFS){
    // 不阻止默认行为，让浏览器处理 Esc
  }
  // F11 全屏切换
  if(e.key==="F11"){
    e.preventDefault();
    toggleFS(!isFS);
  }
  // Ctrl/Cmd + Shift + F 快捷切换
  if((e.key==="f"||e.key==="F")&&(e.ctrlKey||e.metaKey)&&e.shiftKey){
    e.preventDefault();
    toggleFS(!isFS);
  }
});

// ── 视口变化时重新计算缩放 ──
let resizeTimer=null;
window.addEventListener("resize",()=>{
  if(isFS){
    clearTimeout(resizeTimer);
    resizeTimer=setTimeout(calcFSScale,100);
  }
});

// ── DPR 变化监听 ──
// 当用户把窗口从普通屏拖到 4K 屏（或反之）时，自动重新计算缩放
// 确保在任何 DPI 下都能保持最佳清晰度
let lastDPR=window.devicePixelRatio||1;
window.matchMedia(`(resolution: ${lastDPR}dppx)`).addEventListener?.("change",()=>{
  lastDPR=window.devicePixelRatio||1;
  // DPR 变化（窗口拖到 4K 屏）→ 位图也要跟着重建，否则仍按旧 DPR 栅格化
  try{ if(typeof resizeSpecCanvas==="function") resizeSpecCanvas(); }catch(_){}
  if(isFS) calcFSScale();
});
// 兼容方案：监听 screen 变化
window.addEventListener("orientationchange",()=>{
  if(isFS) setTimeout(calcFSScale,200);
});

// ── 初始化：如果页面加载时已处于全屏状态 ──
// 直接落库即可（没有"上一状态"可供 FLIP 插值，动画无意义）
if(document.fullscreenElement||document.webkitFullscreenElement||document.msFullscreenElement){
  applyFSState(true);
}

// ════════════════════════════════════════════════════════════════════════════
// 自动搜台（Auto Scan）
// ────────────────────────────────────────────────────────────────────────────
// 打开页面就并行探测各广播源，找出第一个真正能用的并自动接上，
// 不用等到手动换台时才发现某个源是坏的。
//
// 探测原理：本页 <audio> 带 crossorigin="anonymous"，跨域策略不通的源
//   根本加载不了；所以用 fetch 预检——fetch 能通过，播放基本也一定能成。
// 结果缓存：上次连上的源记在 localStorage，7 天内下次打开优先试它，
//   命中就秒连，不必每次全量扫描。
// ════════════════════════════════════════════════════════════════════════════

// 已确认停播 / 已迁移的频率，扫描时直接跳过（2025-12-23 起停止原有节目播出）
const KNOWN_DEAD = [
  "CRI HIT FM 88.7",      // 劲曲调频（英文呼号），2025-12-23 起停播
  "CRI 劲曲调频 87.9",     // 同一频率的上海频点，同步停播
  "CRI 轻松调频",          // EZFM，同日停止原有节目，频点由 CGTN Radio 接管
];

const SCAN_CACHE_KEY="panda6519_laststation_v1";
const SCAN_CACHE_TTL=7*24*3600*1000;   // 缓存有效期 7 天
const SCAN_CONCURRENCY=6;              // 并行探测数
const SCAN_TIMEOUT=5000;               // 单个源超时（毫秒）
const SCAN_DEADLINE=25000;             // 整轮扫描总时限，超时就停，避免一直转圈

let scanToken=0,scanRunning=false;setScanSpin(false);
// 扫描态：给搜台按钮上旋转扫针 + 脉冲环，状态一眼可见
function setScanSpin(on){
  try{ const b=document.getElementById("scanBtn"); if(b) b.classList.toggle("scanning",!!on); }catch(_){}
}

/* ════════════════════════════════════════════════════════════════════════════
   源探测：一级 fetch 抓取，二级静音实播兜底
   ★ 全程 muted，只判定能不能出声，绝不真出声
   ════════════════════════════════════════════════════════════════════════════ */
const PROBE_FETCH_TIMEOUT=5000;
const PROBE_PLAY_TIMEOUT=6000;

async function probeFetch(url){
  const ctl=new AbortController();
  const timer=setTimeout(()=>{try{ctl.abort();}catch(_){}},PROBE_FETCH_TIMEOUT);
  try{
    const isM3u=/\.m3u8(\?|$)/i.test(url);
    const res=await fetch(url,{
      method:"GET",
      headers:isM3u?{}:{"Range":"bytes=0-1023"},
      signal:ctl.signal,credentials:"omit",cache:"no-store",mode:"cors"
    });
    clearTimeout(timer);
    if(!res.ok) return {ok:false,reason:"HTTP "+res.status};
    if(isM3u){
      const txt=(await res.text()||"").slice(0,4096);
      if(!/#EXTM3U/i.test(txt)) return {ok:false,reason:"非HLS"};
      return {ok:true};
    }
    const ct=(res.headers.get("content-type")||"").toLowerCase();
    if(ct.indexOf("text/html")>=0) return {ok:false,reason:"返回网页"};
    return {ok:true};
  }catch(e){
    clearTimeout(timer);
    const r=(e&&e.name==="AbortError")?"超时":"CORS/网络不通";
    return {ok:false,reason:r};
  }
}

// 二级兜底：很多源其实能放，只是不允许跨域 fetch。
// 用静音 audio 真正解码几帧来判定 —— muted=true，全程不出声。
function probePlay(url){
  return new Promise(resolve=>{
    let done=false,a=null;
    const fin=(ok,reason)=>{
      if(done)return; done=true; clearTimeout(timer);
      if(a){ try{a.pause();a.removeAttribute("src");a.src="";a.load();}catch(_){} }
      resolve({ok,reason});
    };
    const timer=setTimeout(()=>fin(false,"超时"),PROBE_PLAY_TIMEOUT);
    try{
      a=new Audio();
      a.muted=true; a.volume=0; a.preload="auto";
      a.addEventListener("canplay",()=>fin(true));
      a.addEventListener("loadedmetadata",()=>fin(true));
      a.addEventListener("error",()=>fin(false,"无法解码"));
      a.src=url; a.load();
    }catch(e){ fin(false,"加载失败"); }
  });
}

async function probeUrl(url){
  if(!url) return {ok:false,reason:"空地址"};
  if(deadUrls.has(url)) return {ok:false,reason:"已屏蔽"};
  if(urlState[url]==="ok") return {ok:true};
  urlState[url]="testing";
  const r1=await probeFetch(url);
  if(r1.ok){ urlState[url]="ok"; return r1; }
  const r2=await probePlay(url);
  if(r2.ok){ urlState[url]="ok"; return r2; }
  urlState[url]="bad"; deadUrls.add(url);
  return {ok:false,reason:r2.reason||r1.reason};
}

// 判定失败的源 → 本次会话内屏蔽，刷新页面自动解禁
function markDead(url){
  if(!url)return;
  urlState[url]="bad"; deadUrls.add(url);
}
// 判定成功的源 → 提到该台队首并记住，下次点它直接命中
function markGood(url,name){
  if(!url)return;
  urlState[url]="ok"; deadUrls.delete(url);
  if(!name)return;
  bestUrl[name]=url;
  try{ localStorage.setItem(PACK_BEST,JSON.stringify(bestUrl)); }catch(_){}
  const it=BOOK_FLAT.find(x=>x.name===name);
  if(it&&it.urls.indexOf(url)>0) it.urls=[url,...it.urls.filter(u=>u!==url)];
}

// 扫描顺序：上次连通的 → 本地台 → 国家级 → 其余
function buildScanList(){
  const out=[];
  const push=(st,idx)=>{ if(st&&st.urls&&st.urls.length) out.push({st,idx}); };
  try{
    const last=JSON.parse(localStorage.getItem(SCAN_CACHE_KEY)||"null");
    if(last&&last.name&&Date.now()-last.ts<SCAN_CACHE_TTL){
      const i=BOOK_FLAT.findIndex(s=>s.name===last.name);
      if(i>=0) push(BOOK_FLAT[i],i);
    }
  }catch(_){}
  const localKw=["广东","深圳","广州","惠州","大湾区","羊城","珠江","飞扬","东莞","佛山"];
  BOOK_FLAT.forEach((s,i)=>{ if(localKw.some(k=>s.name.indexOf(k)>=0)) push(s,i); });
  BOOK_FLAT.forEach((s,i)=>{ if(/^(CNR|CRI|CGTN)/.test(s.name)) push(s,i); });
  BOOK_FLAT.forEach((s,i)=>push(s,i));
  const seen=new Set();
  return out.filter(x=>{ if(seen.has(x.st.name))return false; seen.add(x.st.name); return true; });
}

// 只把台"选中"上屏：台名、指针、列表高亮 —— 不碰音频，一声不出
function selectStation(st,idx){
  if(!st)return;
  currentStation=st;
  displayName.textContent=st.name;
  let pct;
  if(typeof idx==="number"&&idx>=0&&BOOK_FLAT.length>1) pct=(idx/(BOOK_FLAT.length-1))*100;
  else pct=Math.abs(hashCode(st.name))%100;
  try{ dialPointer.style.left=`${20+pct*0.6}%`; }catch(_){}
  renderStationList();
}

/* ═══ 自动搜台：静默测源，只标记可用/失效，绝不自动播放 ═══
   测完把最好的台选中上屏，出声必须等你按 ▶                                */
async function autoScan(){
  if(scanRunning) return;
  if(!BOOK_FLAT.length){
    displayStatus.textContent="READY · 电台簿为空";
    return;
  }
  scanRunning=true;setScanSpin(true);
  const myToken=++scanToken;
  const list=buildScanList();
  const queue=list.slice();
  const total=list.length;
  let okN=0,badN=0,firstGood=null;
  const deadlineAt=Date.now()+SCAN_DEADLINE;
  displayStatus.textContent=`静默测源… 0/${total} · 通 0`;

  const worker=async()=>{
    while(queue.length){
      if(myToken!==scanToken) return;
      if(Date.now()>deadlineAt) return;
      const item=queue.shift();
      for(const u of item.st.urls){
        if(myToken!==scanToken) return;
        const r=await probeUrl(u);
        if(r.ok){ okN++; if(!firstGood) firstGood={st:item.st,idx:item.idx,url:u}; break; }
        else badN++;
      }
      displayStatus.textContent=`静默测源… ${total-queue.length}/${total} · 通 ${okN}`;
      if((total-queue.length)%3===0) renderStationList();
    }
  };
  await Promise.all(Array.from({length:Math.min(SCAN_CONCURRENCY,total)},()=>worker()));

  scanRunning=false;setScanSpin(false);
  if(myToken!==scanToken) return;

  if(firstGood){
    markGood(firstGood.url,firstGood.st.name);
    try{ localStorage.setItem(SCAN_CACHE_KEY,JSON.stringify({name:firstGood.st.name,ts:Date.now()})); }catch(_){}
    selectStation(firstGood.st,firstGood.idx);
    displayStatus.textContent=`READY · ${firstGood.st.name}`;
  }else if(Date.now()>deadlineAt){
    displayStatus.textContent="测源超时 · 按 ▶ 手动试";
  }else{
    displayStatus.textContent="READY · 无可用源";
  }
  renderStationList();
}

function cancelScan(){ scanToken++; scanRunning=false;setScanSpin(false); }

// ════════════════════════════════════════════════════════════════════════════
// 初始化
// ════════════════════════════════════════════════════════════════════════════
displayName.textContent="—";
loadPack();                 // 从本机读回频谱表
renderCategoryMenu();
renderStationList();
applyOutputVolume();
setVolumeVisual(userVolume,false);
vuNeedle.style.transform=`rotate(${VU_MIN_ANGLE}deg)`;
vuPeak.classList.remove("on");
setTimeout(()=>{volumeKnob.style.transition="transform 0.4s cubic-bezier(.4,0,.2,1)";volumeKnob.style.transform=`rotate(${volToAngle(userVolume)}deg)`;},100);
// ═══ 频谱窗：独立于指针的绘制循环，页面一起动就转 ═══
startSpectrumLoop();

// ═══ 自动搜台：点一下静默测一遍源，只标记不出声 ═══
const scanBtn=document.getElementById("scanBtn");
if(scanBtn){
  scanBtn.addEventListener("click",()=>{ cancelScan(); autoScan(); });
}
// 用户一旦自己动手（播放/选台/开面板），就停掉后台扫描，别打架
["playBtn","prevBtn","nextBtn","tuningKnob"].forEach(id=>{
  const el=document.getElementById(id);
  if(el) el.addEventListener("click",cancelScan,{capture:true});
});
// 打开页面先静默测一遍：只给列表打上绿点/灰点，一声不出
setTimeout(()=>{ if(!currentStation&&!isPlaying) autoScan(); },600);

// ═══ 预热定位：页面加载后主动获取一次城市 ═══
// 作用：把"允许定位"的弹窗提前到首次换台之前，且由于 detectUserCity()
// 内部已做缓存与并发合并，后续换台/FM 追踪都会直接复用本次结果，
// 不会再弹权限确认框。放在用户首次手势（点击）之后调用更稳妥，
// 部分浏览器会把非手势触发的定位静默拦截。
function warmupCity(){
  detectUserCity().catch(()=>{});
}
// 优先绑定到首次点击/触摸（用户手势后调用成功率最高）
const warmupHandler=()=>{ warmupCity(); window.removeEventListener("click",warmupHandler); window.removeEventListener("touchstart",warmupHandler); };
window.addEventListener("click",warmupHandler,{once:true});
window.addEventListener("touchstart",warmupHandler,{once:true});
// 兜底：若一直没有交互，3 秒后也尝试一次
setTimeout(warmupCity,3000);

/* ════════════════════════════════════════════════════════════════════════════
   频谱表 · 录入面板
   ════════════════════════════════════════════════════════════════════════════ */
const packBtn=document.getElementById("packBtn");
const packPop=document.getElementById("packPop");
const packText=document.getElementById("packText");
const packMsg=document.getElementById("packMsg");
const packHelp=document.getElementById("packHelp");
const packHelpBody=document.getElementById("packHelpBody");

const HELP_ROWS=[
  ["台名","顶格独占一行，下面缩进的行都归它"],
  ["网址","http:// 或 https:// 开头，缩进两格，写几个都行"],
  ["分组：xxx","分组标题（# xxx 也认）"],
  ["频率：103.9","调谐指针对准 103.9（@103.9 也认，不写就自动估算）"],
  ["别名：a, b","搜简称也能命中（=a, b 也认）"],
  ["备注：xxx","注释，忽略（// xxx 也认）"],
  ["台名|源|源","想挤在一行也认"],
];
const HELP_DEMO=[
"分组：央广",
"CNR 中国之声",
"  http://satellitepull.cnr.cn/live/wxzgzs/playlist.m3u8",
"  http://audiows001.cnr.cn/live/zgzs192/playlist.m3u8",
"  https://lhttp.qtfm.cn/live/15318317/64k.mp3",
"  频率：106.1",
"  别名：中国之声, 中央一套",
].join("\n");
packHelpBody.innerHTML=
  HELP_ROWS.map(r=>`<div class="pack-hrow"><span class="k">${r[0]}</span><span class="d">${r[1]}</span></div>`).join("")
  +`<span class="demo">${HELP_DEMO.replace(/</g,"&lt;")}</span>`;
document.getElementById("packHelpTitle").addEventListener("click",()=>{packHelp.classList.toggle("fold");});
packHelp.classList.remove("fold");

function packMsgShow(t,cls){ packMsg.textContent=t||""; packMsg.className="pack-msg"+(cls?" "+cls:""); }
function setPackPop(on){
  packPop.classList.toggle("show",!!on);
  packBtn.classList.toggle("on",!!on);
  if(on){ try{clearTimeout(toolbarTimer);showToolbar();}catch(_){} }
}
function openPackPanel(){
  try{ closePanel(); }catch(_){}
  if(!packText.value.trim()){
    let sv=null; try{ sv=localStorage.getItem(PACK_KEY); }catch(_){}
    packText.value=(sv&&sv.trim())?sv:PACK_TEMPLATE;
  }
  try{ setSkinPop(false); }catch(_){}
  setPackPop(true);
  setTimeout(()=>{try{packText.focus();}catch(_){}},60);
}
packBtn.addEventListener("click",e=>{
  e.stopPropagation();
  const on=packPop.classList.contains("show");
  try{ setSkinPop(false); }catch(_){}
  setPackPop(!on);
  if(!on&&!packText.value.trim()){
    let sv=null; try{ sv=localStorage.getItem(PACK_KEY); }catch(_){}
    packText.value=(sv&&sv.trim())?sv:PACK_TEMPLATE;
  }
});
document.getElementById("packCloseBtn").addEventListener("click",e=>{e.stopPropagation();setPackPop(false);});
document.addEventListener("click",e=>{
  if(!packPop.classList.contains("show"))return;
  if(packPop.contains(e.target)||packBtn.contains(e.target))return;
  setPackPop(false);
});
// Tab 缩进两格，方便手写
packText.addEventListener("keydown",e=>{
  if(e.key==="Tab"){
    e.preventDefault();
    const a=packText.selectionStart,b=packText.selectionEnd;
    packText.value=packText.value.slice(0,a)+"  "+packText.value.slice(b);
    packText.selectionStart=packText.selectionEnd=a+2;
  }
  if(e.key==="Escape"){ setPackPop(false); }
});

document.getElementById("packApply").addEventListener("click",()=>{
  const txt=packText.value;
  const n=applyPack(txt,true);
  if(!n){
    packMsgShow("没解析到电台 —— 台名要顶格写，网址要缩进两格。照下面说明改改。","err");
    return;
  }
  let srcN=0; BOOK_FLAT.forEach(x=>srcN+=x.urls.length);
  packMsgShow(`已载入 ${n} 个台 / ${srcN} 个源 · 正在静默测源（不出声）`,"ok");
  deadUrls.clear(); cancelScan(); cleanup();
  displayName.textContent="—"; currentStation=null; updatePlayIcon();
  autoScan();
});
document.getElementById("packFormat").addEventListener("click",()=>{
  packText.value=packToText()||PACK_TEMPLATE;
  packMsgShow("已按标准格式整理（缩进两格、分组对齐）","ok");
});
document.getElementById("packProbe").addEventListener("click",()=>{
  if(!BOOK_FLAT.length){ packMsgShow("先点「应用」载入电台","err"); return; }
  deadUrls.clear(); cancelScan(); cleanup(); autoScan();
  packMsgShow("正在静默测源：只标记绿点/灰点，一声不出","ok");
});
document.getElementById("packClear").addEventListener("click",()=>{
  packText.value=PACK_TEMPLATE;
  try{ localStorage.removeItem(PACK_KEY); }catch(_){}
  applyPack("",false); deadUrls.clear(); cleanup();
  currentStation=null; displayName.textContent="—"; displayStatus.textContent="READY";
  updatePlayIcon(); renderStationList(); renderCategoryMenu();
  packMsgShow("已清空电台簿（源包文本也删了）","");
});
document.getElementById("packExport").addEventListener("click",()=>{
  const txt=packText.value&&packText.value.trim()?packText.value:(packToText()||PACK_TEMPLATE);
  const blob=new Blob([txt],{type:"text/plain;charset=utf-8"});
  const a=document.createElement("a");
  a.href=URL.createObjectURL(blob);
  a.download="频谱表.txt";
  document.body.appendChild(a);a.click();
  setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove();},500);
  packMsgShow("已导出 频谱表.txt","ok");
});
const packFile=document.createElement("input");
packFile.type="file"; packFile.accept=".txt,.m3u,.text,text/plain"; packFile.style.display="none";
document.body.appendChild(packFile);
packFile.addEventListener("change",()=>{
  const f=packFile.files&&packFile.files[0]; if(!f)return;
  const r=new FileReader();
  r.onload=()=>{ packText.value=String(r.result||""); packMsgShow("已读入 "+f.name+" · 点「应用」生效","ok"); };
  r.readAsText(f,"utf-8");
  packFile.value="";
});
document.getElementById("packImport").addEventListener("click",()=>packFile.click());

// 面板里顺手给出当前统计
setTimeout(()=>{
  if(BOOK_FLAT.length) packMsgShow(`本机已存 ${BOOK_FLAT.length} 个台`,"");
},800);

</script>
