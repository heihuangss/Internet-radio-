<title>PANDA 6519 · 复古在线收音机</title>
<style>
  :root {
    /* ═══ 默认皮肤：复古原木 ═══ */
    --desk: #d2b48c; --desk-dark: #b89b6e;
    --body: #f5efe2; --body-shade: #e8e0d0;
    --dial: #e8e5dc; --accent-orange: #e67e22; --btn-shadow: #c4c0b3;
    --panel-bg:#f4f0e6; --panel-line:#e6e2d6; --panel-item-hover:#e8e5dc;
    --text-strong:#333; --text-mid:#555; --text-soft:#888;
    --handle: #c9c2b2;
    /* 背景环境 */
    --bg-grad: linear-gradient(135deg,#d2b48c,#b89b6e);
    --bg-floor: radial-gradient(ellipse 80% 60% at 50% 92%,rgba(0,0,0,.22),transparent 70%);
    --env-light: rgba(255,255,255,.10);
    --shadow-color: rgba(0,0,0,.32);
    --ambient-1: rgba(255,214,150,.18);
    --ambient-2: rgba(120,90,40,.14);
  }
  body[data-skin="midnight"]{
    --desk:#2b2f36; --desk-dark:#1a1d22;
    /* 拉开 body 与 body-shade 的明度差，让凸起/凹陷立体感可见 */
    --body:#484c54; --body-shade:#31353c;
    /* dial 比 body-shade 更亮，作为"凹陷面板"明显区别于机身 */
    --dial:#3e424a; --accent-orange:#ff8c42; --btn-shadow:#15171b;
    --panel-bg:#2c3036; --panel-line:#40444c; --panel-item-hover:#3a3e46;
    --text-strong:#f2f0ec; --text-mid:#c4c2be; --text-soft:#8a8e96;
    --handle:#555960;
    --bg-grad:linear-gradient(135deg,#32363d,#16191d);
    --bg-floor:radial-gradient(ellipse 80% 60% at 50% 92%,rgba(0,0,0,.55),transparent 70%);
    --env-light:rgba(255,255,255,.04);
    --shadow-color:rgba(0,0,0,.6);
    --ambient-1:rgba(120,140,255,.12);
    --ambient-2:rgba(0,0,0,.35);
  }
  body[data-skin="mint"]{
    --desk:#d7e4d9; --desk-dark:#b6c8ba;
    --body:#edf5ee; --body-shade:#d8e6dc;
    /* dial 略暗于 body，形成凹陷面板，保留立体层次 */
    --dial:#dfebe4; --accent-orange:#3f9d7c; --btn-shadow:#b4c6bc;
    --panel-bg:#e8f2ec; --panel-line:#cfe0d6; --panel-item-hover:#dcebe2;
    --text-strong:#234a3d; --text-mid:#4f7565; --text-soft:#7fa593;
    --handle:#c6d6cc;
    --bg-grad:linear-gradient(135deg,#d7e4d9,#b6c8ba);
    --bg-floor:radial-gradient(ellipse 80% 60% at 50% 92%,rgba(40,70,55,.20),transparent 70%);
    --env-light:rgba(255,255,255,.45);
    --shadow-color:rgba(40,70,55,.28);
    --ambient-1:rgba(190,235,210,.30);
    --ambient-2:rgba(120,160,140,.14);
  }
  body[data-skin="rosewood"]{
    --desk:#7a4a32; --desk-dark:#5c3522;
    --body:#965f3e; --body-shade:#73412a;
    --dial:#e8ddce; --accent-orange:#e0ac20; --btn-shadow:#4a2c1a;
    --panel-bg:#f2e8d8; --panel-line:#e2d4c0; --panel-item-hover:#eadfcc;
    --text-strong:#3a2518; --text-mid:#6a4a32; --text-soft:#9a7a5a;
    --handle:#73412a;
    --bg-grad:linear-gradient(135deg,#7a4a32,#4a2c1a);
    --bg-floor:radial-gradient(ellipse 80% 60% at 50% 92%,rgba(0,0,0,.40),transparent 70%);
    --env-light:rgba(255,210,170,.08);
    --shadow-color:rgba(40,20,10,.45);
    --ambient-1:rgba(255,190,120,.16);
    --ambient-2:rgba(120,60,30,.22);
  }
  body[data-skin="neon"]{
    --desk:#1a0b2e; --desk-dark:#0d0519;
    /* 机身主体提亮，避免与拨号面板糊成一片 */
    --body:#3a1c60; --body-shade:#260f44;
    /* dial 明显更亮，形成凹陷的"屏幕面板"层次 */
    --dial:#5a2a8a; --accent-orange:#ff4db2; --btn-shadow:#0a0414;
    --panel-bg:#2e164f; --panel-line:#5a3a82; --panel-item-hover:#4a2a72;
    --text-strong:#fff0ff; --text-mid:#d6b8f0; --text-soft:#9a7ac0;
    --handle:#5a3a82;
    --bg-grad:linear-gradient(135deg,#3a1c60,#0d0519 60%,#1a0830);
    --bg-floor:radial-gradient(ellipse 80% 60% at 50% 92%,rgba(255,77,178,.18),transparent 70%);
    --env-light:rgba(180,120,255,.08);
    --shadow-color:rgba(0,0,0,.65);
    --ambient-1:rgba(150,100,255,.20);
    --ambient-2:rgba(255,77,178,.12);
  }
  /* 全屏过渡的统一节奏：机身缩放、背景光晕、阴影、工具栏全部共用，
     由 JS 在切换时按方向写入 —— 所有元素"一起动"，而不是各走各的 */
  :root { --fs-dur:0.76s; --fs-ease:cubic-bezier(0.16, 1, 0.3, 1); }
  /* 滚动条槽位常驻：内容高度在临界点时，滚动条的出现/消失会改变视口宽度，
     居中的机身就会横向抖一下（切换全屏、刷新时都可能触发）。
     both-edges 让左右各留一半，内容依然精确居中。 */
  /* ═══ 动效令牌 ═══
     取向：沉稳克制（Apple 产品页 / Stripe / Vercel 那一路）
     —— 时长偏长、缓动一律 decelerate 家族、不用弹性回弹。
     所有组件共用这一套，避免"各走各的"造成的节奏混乱。 */
  :root {
    /* 时长阶梯：从微反馈到容器形变 */
    --dur-1:120ms;    /* 按下、hover */
    --dur-2:200ms;    /* 开关、按钮、小组件 */
    --dur-3:320ms;    /* 面板、抽屉、菜单 */
    --dur-4:520ms;    /* 换肤等大面积色彩过渡 */
    --dur-5:760ms;    /* 容器形变（全屏） */
    /* 缓动：全部是 decelerate 家族，起步果断、尾段长而柔 */
    --ease-std:cubic-bezier(0.2, 0, 0, 1);        /* 通用 */
    --ease-dec:cubic-bezier(0, 0, 0.2, 1);        /* 进入，纯减速 */
    --ease-acc:cubic-bezier(0.4, 0, 1, 1);        /* 退出，纯加速 */
    --ease-expo:cubic-bezier(0.16, 1, 0.3, 1);    /* 大位移，Apple 感 */

    /* ═══ 高分屏缩放 ═══
       用 zoom 而不是 transform：zoom 是布局级缩放，
       文字会按新字号重新排版并原生渲染（真正的矢量清晰），
       canvas 的 CSS 尺寸也随之变化 → 自动触发更高分辨率重建。
       全屏时改由 --fs-scale 的 transform 负责，故 zoom 复位为 1。 */
    --ui-zoom:1;
  }
  /* 2K / 4K 断点：机身随视口稳稳长大，不靠位图拉伸 */
  @media (min-width:1440px){ :root{ --ui-zoom:1.06; } }
  @media (min-width:1800px){ :root{ --ui-zoom:1.14; } }
  @media (min-width:2200px){ :root{ --ui-zoom:1.26; } }
  @media (min-width:2800px){ :root{ --ui-zoom:1.42; } }
  @media (min-width:3400px){ :root{ --ui-zoom:1.58; } }
  /* 矮屏不放大，避免纵向溢出 */
  @media (max-height:760px){ :root{ --ui-zoom:1; } }

  /* ═══ 无障碍：尊重系统"减少动态效果" ═══
     全局一次性压平，无需在每个组件里各写一遍 */
  @media (prefers-reduced-motion: reduce){
    *, *::before, *::after {
      animation-duration:1ms !important;
      animation-iteration-count:1 !important;
      transition-duration:1ms !important;
      scroll-behavior:auto !important;
    }
  }
  html { scrollbar-gutter: stable both-edges; }
  * { margin:0; padding:0; box-sizing:border-box; user-select:none; }
  body { font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;
    background:var(--bg-grad); min-height:100vh;
    display:flex; justify-content:center; align-items:center; padding:20px;
    transition:background var(--fs-dur) var(--fs-ease), padding var(--fs-dur) var(--fs-ease); position:relative;
    /* 4K / 高分屏渲染优化 */
    -webkit-font-smoothing:antialiased;
    -moz-osx-font-smoothing:grayscale;
    text-rendering:geometricPrecision; }
  /* 背景环境光晕 */
  body::before{ content:""; position:fixed; inset:0; z-index:-2; pointer-events:none;
    background:
      radial-gradient(circle 620px at 18% 22%,var(--ambient-1),transparent 60%),
      radial-gradient(circle 520px at 82% 78%,var(--ambient-2),transparent 62%);
    transition:background var(--fs-dur) var(--fs-ease); }
  /* 桌面/地面投影 */
  body::after{ content:""; position:fixed; left:0; right:0; bottom:0; height:38vh; z-index:-1; pointer-events:none;
    background:var(--bg-floor);
    /* ★ height / opacity 原本是硬切 —— 全屏切换时地面投影会"啪"一下窜高变淡，
       这正是"闪一下"的主要来源。补上过渡后它跟着机身一起走。 */
    transition:background var(--fs-dur) var(--fs-ease),
               height var(--fs-dur) var(--fs-ease),
               opacity var(--fs-dur) var(--fs-ease); }

  .radio-container { position:relative; width:900px; max-width:100%;
    zoom:var(--ui-zoom);
    background:linear-gradient(160deg,var(--body),var(--body-shade)); border-radius:24px;
    box-shadow:0 30px 60px var(--shadow-color), inset 0 1px 0 rgba(255,255,255,.9);
    display:flex; padding:40px; gap:40px;
    /* ★ 原为 overflow:hidden —— 顶部提手(top:-30px)被整个裁掉了。
       改用 clip + clip-margin 精确放开 44px：提手露出来，
       而侧栏抽屉(关起时外移 320px)依然被裁住，不会飘到机身外面。
       clip 还比 hidden 少建一个滚动容器，4K 下合成开销更低。 */
    overflow:hidden;                 /* 老浏览器回退 */
    overflow:clip;
    /* ★ clip-margin 按视觉像素生效、不随 zoom 缩放，而提手会被 zoom 放大
       （30px → 4K 下 47.4px）。取 60px 覆盖最大缩放档。
       注：该属性只接受单个长度（无分轴写法），横向放开的 60px 由
       .panel-clip 这层独立裁剪兜住 —— 抽屉关起时不会飘出机身。 */
    overflow-clip-margin:60px;
    transition:background var(--dur-4) var(--ease-std), box-shadow var(--dur-4) var(--ease-std); }
  .handle { position:absolute; top:-30px; left:50%; transform:translateX(-50%);
    width:300px; height:30px; border:8px solid var(--handle); border-bottom:none; border-radius:30px 30px 0 0;
    transition:border-color var(--dur-4) var(--ease-std); }

  /* ═══ 全屏模式 ═══
     设计原则（参考 Apple HIG / Material Design 全屏规范）：
     1. 全屏时让机身充分利用 16:9 视口空间，两侧不再大面积留白
     2. 过渡方式：FLIP + Web Animations API，对真实 DOM 做 0.52s 缓动缩放
        （不再用 View Transitions 的位图快照，也不改 width）
     3. 16:9 屏幕上，机身高度优先适配，宽度自然延展后居中
     4. 全屏时启用沉浸式背景氛围，强化"桌面上的收音机"沉浸感
     5. 工具栏在全屏时自动隐藏（鼠标移动/触摸时呼出），退出时始终可见
     6. 4K 适配：使用 devicePixelRatio 感知 + SVG 矢量绘制确保边缘锐利 */
  body.fs-lock { padding:0; overflow:hidden; }
  /* 过渡期间也要锁：退出全屏时放大态的机身会撑出滚动条，
     视口宽度一变，居中的机身就会横向抖一下（实测约 7.5px） */
  body.fs-animating { overflow:hidden; }

  /* ═══ 基础容器 ═══
     过渡策略：FLIP（First-Last-Invert-Play）+ Web Animations API。
     · 不使用 View Transitions —— 它对容器做的是"位图快照 + 交叉淡化"，
       快照按 1x 栅格化后再被拉伸到目标尺寸，含大量文字时必然先糊后清。
     · FLIP 全程操作真实 DOM：元素一开始就是最终布局尺寸，
       只在其上叠加一个合成层 transform，浏览器按动画的最大缩放比栅格化，
       因此放大过程中文字始终按矢量清晰度渲染。
     · will-change 只在动画期间挂上，结束后移除 → 强制按最终比例重新栅格化。 */
  .radio-container {
    transform-origin:50% 50%;
    transition:background var(--dur-4) var(--ease-std), box-shadow var(--dur-4) var(--ease-std);
  }
  /* 全屏时由 JS 设置 --fs-scale，这里统一消费该变量。
     ★ border-radius 不再手动乘 scale：transform 会把 24px 圆角一起等比放大，
       再乘一次就变成 24·S²，机身会被拉成过度圆润的形状。 */
  body.fs-lock .radio-container {
    position:fixed;
    zoom:1;                    /* 全屏交由 --fs-scale 的 transform，避免二次缩放 */
    top:50%; left:50%;
    transform:translate(-50%,-50%) scale(var(--fs-scale,1));
  }
  .radio-container.fullscreen { width:900px; max-width:none; }

  /* 全屏时增强背景沉浸感：更深邃的光影层次 */
  body.fs-lock::before {
    background:
      radial-gradient(circle 45vmax at 50% 45%, var(--ambient-1), transparent 55%),
      radial-gradient(circle 35vmax at 50% 95%, var(--ambient-2), transparent 50%);
  }
  body.fs-lock::after {
    height:50vh;
    opacity:0.8;
  }

  /* ═══ 工具栏（皮肤 / 全屏）═══
     脱离 .radio-container 定位到视口右上角，保证全屏切换时始终可见、
     位置恒定，不会跟着机身等比缩放或跑到画面外。
     全屏模式下自动隐藏，鼠标靠近顶部时淡入。 */
  .toolbar { position:fixed; top:16px; right:16px; z-index:9999; display:flex; gap:8px;
    transition:opacity var(--fs-dur) var(--fs-ease), transform var(--fs-dur) var(--fs-ease),
               top var(--fs-dur) var(--fs-ease); }
  /* 全屏时工具栏自动隐藏 */
  body.fs-lock .toolbar { opacity:0; transform:translateY(-12px); pointer-events:none; }
  body.fs-lock .toolbar.visible { opacity:1; transform:translateY(0); pointer-events:auto; }
  /* 全屏退出提示 */
  body.fs-lock .toolbar .fs-hint {
    position:absolute; right:0; top:52px; font-size:11px; color:var(--text-soft);
    background:var(--panel-bg); border:1px solid var(--panel-line); border-radius:6px;
    padding:5px 10px; white-space:nowrap; opacity:0; transform:translateY(-4px);
    transition:opacity var(--dur-3), transform var(--dur-3); box-shadow:0 4px 12px rgba(0,0,0,.18);
    pointer-events:none;
  }
  body.fs-lock .toolbar.visible .fs-hint { opacity:1; transform:translateY(0); }

  /* ═══ 全屏专属视觉增强 ═══
     让 16:9 大屏上机身更有"实体感"，
     背景光晕随皮肤变化，机身阴影更深邃。 */
  body.fs-lock .radio-container {
    box-shadow:
      0 40px 100px var(--shadow-color),
      0 20px 40px rgba(0,0,0,.15),
      inset 0 1px 0 rgba(255,255,255,.9),
      inset 0 -2px 8px rgba(0,0,0,.06);
  }
  /* 全屏时背景环境光更柔和 */
  body.fs-lock { background:var(--bg-grad); }
  /* 全屏时侧边栏也适当增强阴影 */
  body.fs-lock .side-panel {
    box-shadow:-8px 0 30px rgba(0,0,0,.15);
  }
  .side-panel { transition:transform var(--dur-3) var(--ease-std), background var(--dur-4),
                           visibility var(--dur-3), box-shadow var(--fs-dur) var(--fs-ease); }
  /* 全屏时 VU 表盘金属环增强立体感 */
  body.fs-lock .vu-metal-ring {
    box-shadow:
      0 20px 50px rgba(0,0,0,.5),
      0 8px 20px rgba(0,0,0,.25),
      inset 0 1px 2px rgba(255,255,255,.15);
  }
  /* 全屏时旋钮增强高光 */
  body.fs-lock .knob {
    box-shadow:
      6px 6px 14px rgba(0,0,0,.18),
      -3px -3px 10px rgba(255,255,255,.85),
      inset 0 0 0 4px var(--dial),
      inset 0 0 0 6px var(--body-shade);
  }
  /* ═══ 工具栏按钮：复古铭牌质感 + 统一描边图标 ═══
     做法：双层渐变做出金属铭牌的顶光/侧影，图标一律走 stroke 描边
     （线宽一致、端点圆润），比原来的实心色块更精致、也更贴合机身。 */
  .tool-btn { position:relative; width:40px; height:40px; border-radius:12px; border:none; cursor:pointer;
    color:var(--text-mid);
    background:
      linear-gradient(180deg, rgba(255,255,255,.55), rgba(255,255,255,0) 46%),
      linear-gradient(180deg, var(--panel-bg), color-mix(in srgb, var(--panel-bg) 84%, var(--btn-shadow)));
    box-shadow:0 4px 12px rgba(0,0,0,.26), 0 1px 2px rgba(0,0,0,.14),
      inset 0 1px 0 rgba(255,255,255,.85), inset 0 -1px 0 rgba(0,0,0,.10);
    display:flex; align-items:center; justify-content:center;
    transition:transform var(--dur-2) var(--ease-dec), background var(--dur-4), box-shadow var(--dur-2), color var(--dur-2); }
  .tool-btn:hover{ transform:translateY(-2px); color:var(--text-strong);
    box-shadow:0 8px 18px rgba(0,0,0,.30), 0 1px 2px rgba(0,0,0,.14),
      inset 0 1px 0 rgba(255,255,255,.92), inset 0 -1px 0 rgba(0,0,0,.10); }
  .tool-btn:active{ transform:translateY(0) scale(.95);
    box-shadow:0 2px 6px rgba(0,0,0,.28), inset 0 2px 4px rgba(0,0,0,.18); }
  .tool-btn:focus-visible{ outline:2px solid var(--accent-orange); outline-offset:2px; }
  .tool-btn svg{ width:21px; height:21px; fill:none; stroke:currentColor; stroke-width:1.7;
    stroke-linecap:round; stroke-linejoin:round; transition:stroke var(--dur-2); }
  /* 皮肤色点用真实配色，一眼认出是"换肤" */
  .skin-ico .dot{ stroke:none; }
  /* 自动搜台：扫描中的旋转扫针 + 外圈脉冲，状态一眼可见 */
  #scanBtn .scan-sweep{ opacity:0; transform-origin:12px 12px; }
  #scanBtn.scanning{ color:var(--accent-orange); }
  #scanBtn.scanning .scan-sweep{ opacity:1; animation:scanSweep 1.05s linear infinite; }
  @keyframes scanSweep{ from{transform:rotate(0deg);} to{transform:rotate(360deg);} }
  #scanBtn.scanning::after{ content:""; position:absolute; inset:-3px; border-radius:14px;
    border:1.5px solid var(--accent-orange); pointer-events:none;
    animation:scanPulse 1.2s ease-out infinite; }
  @keyframes scanPulse{ 0%{opacity:.7;transform:scale(1);} 100%{opacity:0;transform:scale(1.28);} }
  /* 皮肤弹层展开时按钮保持点亮 */
  #skinBtn.on{ color:var(--accent-orange); }
  .tool-btn .tip { position:absolute; top:44px; right:0; font-size:11px; color:var(--text-strong);
    background:var(--panel-bg); border:1px solid var(--panel-line); border-radius:6px; padding:4px 8px;

  .knob { width:60px; height:60px; border-radius:50%; background:linear-gradient(145deg,var(--body),var(--body-shade));
    box-shadow:4px 4px 8px rgba(0,0,0,.15),-2px -2px 6px rgba(255,255,255,.8),inset 0 0 0 4px var(--dial),inset 0 0 0 6px var(--body-shade); position:relative; cursor:pointer; display:flex; align-items:center; justify-content:center; transition:filter var(--dur-1),transform var(--dur-2) var(--ease-dec), background var(--dur-4), box-shadow var(--dur-4); }
  .knob::after { content:""; width:4px; height:20px; background:var(--text-mid); border-radius:2px; position:absolute; top:6px; left:50%; transform:translateX(-50%); box-shadow:0 1px 2px rgba(0,0,0,.3); }
  .volume-slider { position:relative; width:110px; height:22px; cursor:pointer; display:flex; align-items:center; touch-action:none; }
  .volume-slider::before { content:""; position:absolute; left:0; right:0; top:50%; height:6px; transform:translateY(-50%); background:var(--body-shade); border-radius:3px; box-shadow:inset 0 1px 3px rgba(0,0,0,.2),0 1px 0 rgba(255,255,255,.8); }
  .volume-bar { position:absolute; left:0; top:50%; height:6px; width:80%; transform:translateY(-50%); background:linear-gradient(90deg,var(--accent-orange),color-mix(in srgb,var(--accent-orange) 70%,#fff)); border-radius:3px; pointer-events:none; box-shadow:0 0 6px color-mix(in srgb,var(--accent-orange) 60%,transparent); }
  .volume-thumb { position:absolute; left:80%; top:50%; width:16px; height:16px; border-radius:50%; background:radial-gradient(circle at 35% 30%,#fff,var(--dial) 45%,var(--body-shade)); box-shadow:0 2px 4px rgba(0,0,0,.3),inset 0 1px 0 rgba(255,255,255,.95),0 0 0 2px rgba(255,255,255,.7); transform:translate(-50%,-50%); pointer-events:none; }
  .buttons-group { display:flex; gap:12px; padding-top:10px; }
  .phys-btn { width:50px; height:35px; border-radius:6px; border:none; background:linear-gradient(180deg,var(--dial),var(--body-shade));
    box-shadow:0 4px 0 var(--btn-shadow),0 5px 10px rgba(0,0,0,.1),inset 0 1px 0 rgba(255,255,255,1); cursor:pointer; display:flex; align-items:center; justify-content:center; transition:all var(--dur-1); }
  .phys-btn:active { transform:translateY(4px); box-shadow:0 0 0 var(--btn-shadow),0 2px 5px rgba(0,0,0,.1),inset 0 1px 0 rgba(255,255,255,1); }
  .phys-btn svg { width:18px; height:18px; fill:var(--text-mid); display:block; }
  .phys-btn.play-btn svg { fill:var(--accent-orange); }
  .phys-btn .loading-spinner { display:none; width:16px; height:16px; border:2px solid transparent; border-top-color:var(--accent-orange); border-radius:50%; animation:spin .7s linear infinite; }
  .phys-btn.loading .play-icon { display:none; }
  .phys-btn.loading .loading-spinner { display:block; }
  /* 侧栏独立裁剪层：容器为了露出顶部提手放开了 60px 的裁剪边距，
     若不管，抽屉关起时会有碎边飘到机身外。给它单独一层严格裁剪即可。 */
  .panel-clip { position:absolute; inset:0; overflow:hidden; border-radius:inherit;
    z-index:10; pointer-events:none; }
  .panel-clip > .side-panel { pointer-events:auto; }
  .side-panel { position:absolute; top:0; right:0; width:320px; height:100%; background:var(--panel-bg); box-shadow:-5px 0 15px rgba(0,0,0,.1); transform:translateX(100%); transition:transform var(--dur-3) var(--ease-std), background var(--dur-4), visibility var(--dur-3); z-index:10; display:flex; flex-direction:column; border-left:1px solid var(--panel-line); visibility:hidden; pointer-events:none; }
  .side-panel.open { transform:translateX(0); visibility:visible; pointer-events:auto; }
  /* 修复"列表偶尔退不出来"：工具栏(z-index:9999)固定在视口右上角，会盖住面板右上角的 ✕ 关闭按钮。
     面板打开期间强制隐藏工具栏并禁止其拦截点击。 */
  body.panel-open .toolbar { opacity:0 !important; transform:translateY(-12px) !important; pointer-events:none !important; }

  .station-item { padding:12px 20px; display:flex; justify-content:space-between; align-items:center; cursor:pointer; transition:background var(--dur-2); font-size:13px; color:var(--text-mid); border-bottom:1px solid var(--panel-line); }
  .station-item:hover { background:var(--panel-item-hover); }
  .station-item.active { background:var(--panel-item-hover); font-weight:bold; color:var(--accent-orange); }
  .station-item .item-left { display:flex; align-items:center; gap:8px; overflow:hidden; flex:1; }

  .add-form .submit-btn:active { transform:translateY(4px); box-shadow:0 0 0 color-mix(in srgb,var(--accent-orange) 65%,#000); }

  .add-form .restore-btn { margin-top:20px; padding:10px; background:var(--panel-bg); border:1px dashed var(--text-soft); border-radius:6px; font-size:12px; color:var(--text-mid); cursor:pointer; }

  .panel-toggle-bar { padding:15px 20px; border-top:1px solid var(--panel-line); background:var(--panel-bg); }
  .panel-toggle-bar button { width:100%; background:var(--body-shade); border:none; padding:10px; border-radius:6px; font-size:12px; font-weight:bold; color:var(--text-mid); cursor:pointer; }

  /* ═══ 搜索框 ═══ */
  .search-box { padding:14px 20px 0; display:flex; gap:8px; }
  .search-box input { flex:1; padding:10px 12px; border-radius:6px; border:1px solid var(--body-shade); background:var(--dial); color:var(--text-strong); font-size:13px; outline:none; font-family:inherit; }
  .search-box input:focus { border-color:var(--accent-orange); }
  .search-btn { width:40px; border:none; border-radius:6px; background:var(--accent-orange); font-size:15px; cursor:pointer; display:flex; align-items:center; justify-content:center; flex-shrink:0; }
  .search-hint { padding:6px 20px 10px; font-size:11px; color:var(--text-soft); line-height:1.5; }
  .section-title { padding:16px 20px 8px; font-size:11px; color:var(--text-soft); letter-spacing:1px; font-weight:bold; }
  .section-sub { font-weight:normal; color:var(--accent-orange); margin-left:4px; }
  .result-query { font-size:12px; color:var(--text-mid); padding:0 0 10px; }
  .result-query span { color:var(--accent-orange); font-weight:bold; }

  /* ═══ 分类菜单项（二级菜单入口）═══ */
  .cat-item { padding:12px 20px; display:flex; justify-content:space-between; align-items:center; cursor:pointer; transition:background var(--dur-2); font-size:13px; color:var(--text-mid); border-bottom:1px solid var(--panel-line); }

  /* ═══ 检索结果列表 ═══ */
  .result-item { padding:12px 20px; display:flex; justify-content:space-between; align-items:center; cursor:pointer; transition:background var(--dur-2); font-size:13px; color:var(--text-mid); border-bottom:1px solid var(--panel-line); }
  .result-item:hover { background:var(--panel-item-hover); }

  .result-item .res-name { color:var(--text-strong); font-size:13px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .result-item .res-meta { font-size:10px; color:var(--text-soft); }

  .result-empty { padding:20px; text-align:center; font-size:12px; color:var(--text-soft); line-height:1.6; }

  /* ═══ 官方源分组二级菜单 ═══ */
  .group-item { border-bottom:1px solid var(--panel-line); }
  .group-head { padding:11px 20px; display:flex; justify-content:space-between; align-items:center; background:var(--body-shade); }

  .group-body .station-item:last-child { border-bottom:none; }
  .result-empty .retry-btn { margin-top:10px; padding:8px 14px; background:var(--accent-orange); color:#fff; border:none; border-radius:6px; font-size:12px; cursor:pointer; }
  .loading-dots::after { content:""; animation:dots 1.2s steps(4,end) infinite; }
  @keyframes dots { 0%{content:"";} 25%{content:"·";} 50%{content:"··";} 75%{content:"···";} }
  .confirm-mask { position:absolute; inset:0; background:rgba(30,25,20,.5); display:none; align-items:center; justify-content:center; z-index:100; border-radius:24px; backdrop-filter:blur(2px); }
  .confirm-mask.show { display:flex; }
  .confirm-box { background:var(--dial); border-radius:12px; padding:22px 24px; box-shadow:0 20px 50px rgba(0,0,0,.3); max-width:280px; width:85%; text-align:center; }
  .confirm-title { font-size:14px; font-weight:bold; color:var(--text-strong); margin-bottom:8px; }
  .confirm-msg { font-size:12px; color:var(--text-mid); margin-bottom:20px; line-height:1.5; }

  .confirm-actions button { flex:1; padding:9px; border-radius:6px; border:none; font-size:12px; font-weight:bold; cursor:pointer; }
  .btn-cancel { background:var(--body-shade); color:var(--text-mid); }
  .btn-confirm { background:#e74c3c; color:#fff; box-shadow:0 3px 0 #b03a2e; }
  .btn-confirm:active { transform:translateY(3px); box-shadow:0 0 0 #b03a2e; }

  @keyframes spin { 100%{ transform:rotate(360deg); } }

  @media (max-width:768px){
    .radio-container { flex-direction:column; padding:20px; gap:22px; }

</style>

    <div class="panel-view active" id="mainView">
      <div class="search-box">
        <input type="text" id="searchInput" placeholder="找台：中国之声 / 交通 / FM103.9" autocomplete="off">
        <button class="search-btn" id="searchBtn" title="搜索">🔍</button>
      </div>
      <div class="search-hint" id="searchHint">在本机电台簿里找台 · 点右上角「📋 频谱表」录入源</div>
      <div id="categoryList"></div>
      <div class="section-title">全部电台 <span class="section-sub" id="customCount"></span></div>
      <div id="stationListContainer"></div>
    </div>

    <!-- 二级菜单：检索结果 -->
    <div class="panel-view" id="resultView">
      <div class="add-form">
        <button class="back-btn" id="backToMainBtn">← 返回搜索</button>
        <div class="result-query">「<span id="resultQuery"></span>」的可用源</div>
        <div id="resultList"></div>
      </div>
    </div>

    <div class="panel-toggle-bar">
      <button id="toggleAddViewBtn">📋 打开频谱表</button>
    </div>
  </div>
  </div>

  <div class="confirm-mask" id="confirmMask">
    <div class="confirm-box">
      <div class="confirm-title">删除频道</div>
      <div class="confirm-msg" id="confirmMsg">确定要删除这个频道吗？</div>
      <div class="confirm-actions">
        <button class="btn-cancel" id="confirmCancel">取消</button>
        <button class="btn-confirm" id="confirmOk">删除</button>
      </div>
    </div>
  </div>
</div>

function splitList(str){
  return String(str||"").split(/[,，、;；]/).map(x=>x.trim()).filter(Boolean);
}
function parseStationHead(t){
  let name=t, urls=[], fm=null, aliases=[];
  if(name.indexOf("|")>=0){                       // 单行式：台名|源1|源2
    const seg=name.split("|").map(x=>x.trim()).filter(Boolean);
    name=seg[0]||"";
    urls=seg.slice(1).filter(x=>/^https?:\/\//i.test(x));
  }
  let m=name.match(/[=＝]\s*([^=＝]+)\s*$/);       // =别名
  if(m){ aliases=splitList(m[1]); name=name.slice(0,m.index).trim(); }
  m=name.match(/[@＠]\s*(\d{2,3}(?:\.\d{1,2})?)/);  // @频率
  if(m){ fm=parseFloat(m[1]); name=name.replace(m[0],"").trim(); }
  return {name:name||"未命名", fm:fm, aliases:aliases, urls:urls};
}
function parsePack(text){
  const groups=[]; let cur={name:"未分组",stations:[]}; let st=null;
  const flush=()=>{ const keep=cur.stations.filter(s=>s.urls.length); if(keep.length) groups.push({name:cur.name,stations:keep}); };
  for(const raw of String(text||"").split(/\r?\n/)){
    const line=raw.replace(/\s+$/,"");
    if(!line.trim()) continue;
    const indented=/^[ \t　]/.test(raw);
    const t=line.trim();
    if(t.slice(0,2)==="//") continue;
    if(/^备注\s*[：:]/.test(t)) continue;
    if(!indented){
      const gm=t.match(/^(?:分组|分组名|分类)\s*[：:]\s*(.+)$/)||t.match(/^#\s*(.+)$/);
      if(gm){ flush(); cur={name:gm[1].trim(),stations:[]}; st=null; continue; }
      st=parseStationHead(t); cur.stations.push(st); continue;
    }
    if(!st) continue;
    if(/^https?:\/\//i.test(t)){ st.urls.push(t); continue; }
    let m;
    if((m=t.match(/^(?:频率|调频|FM)\s*[：:]?\s*(\d{2,3}(?:\.\d{1,2})?)$/i))){ st.fm=parseFloat(m[1]); continue; }
    if((m=t.match(/^@\s*(\d{2,3}(?:\.\d{1,2})?)$/))){ st.fm=parseFloat(m[1]); continue; }
    if((m=t.match(/^(?:别名|又叫|又称|简称)\s*[：:]\s*(.+)$/))){ st.aliases=splitList(m[1]); continue; }
    if((m=t.match(/^=\s*(.+)$/))){ st.aliases=splitList(m[1]); continue; }
    if(/^[\w\-]+(\.[\w\-]+)+\//.test(t)){ st.urls.push("http://"+t); continue; }  // 省略协议头
  }
  flush();
  return groups;
}

function packToText(){

      return l.join("\n");
    }).join("\n");
    return head+"\n"+body;
  }).join("\n\n")+"\n";
}

// FM 频率 → 指针百分比（0~100）
function fmToPercent(fm){
  const pct=((fm-FM_MIN)/(FM_MAX-FM_MIN))*100;
  return Math.max(0,Math.min(100,pct));
}
// 指针百分比 → 实际 left（限制在刻度盘 20%~80% 之间，和关闭 FM 时保持一致）
function fmToDialLeft(fm){
  return DIAL_LEFT+fmToPercent(fm)*DIAL_SPAN/100;
}

// 台名归一化：去掉空格/括号/常见后缀，方便模糊匹配
function normFMName(s){
  return String(s||"")
    .replace(/[\s\(\)（）\[\]【】·・\-—_]/g,"")
    .replace(/(电台|广播|调频|立体声)$/g,"")
    .toLowerCase();
}

// 按城市取值（支持"北京市"→"北京"这类模糊城市名）
function pickCityFM(v){
  if(!v) return null;
  if(typeof v==="number") return v;
  if(userCity){
    if(v[userCity]!==undefined) return v[userCity];
    for(const k in v){
      if(k==="default") continue;
      if(userCity.indexOf(k)>=0||k.indexOf(userCity)>=0) return v[k];
    }
  }
  return v["default"]!==undefined?v["default"]:null;
}

// 查内置对照表（关键字双向包含，取最长的关键字）
function lookupLocalFM(stationName){
  const raw=CNR_FM_MAP[stationName];
  if(raw!==undefined){const f=pickCityFM(raw);if(f)return f;}
  const n=normFMName(stationName);
  let hit=null,hitLen=0;
  for(const k in CNR_FM_MAP){
    const nk=normFMName(k);
    if(!nk) continue;
    if(n===nk||n.indexOf(nk)>=0||nk.indexOf(n)>=0){
      if(nk.length>hitLen){hitLen=nk.length;hit=CNR_FM_MAP[k];}
    }
  }
  return hit?pickCityFM(hit):null;
}

// 从文本里解析 FM 频率：FM100.6 / 97.4MHz / 调频87.9 / 飞扬971
// requireMark=true 时只认带 FM/MHz/调频/频率/兆赫 标记的（更可信）
function parseFMFromText(text,requireMark){
  if(!text) return null;
  const t=String(text);
  const hasMark=/(?:FM|MHz|兆赫|调频|频率)/i.test(t);
  if(requireMark&&!hasMark) return null;
  const marked=t.match(/(?:FM|MHz|兆赫|调频|频率)\s*(\d{2,3}(?:\.\d{1,2})?)/i)
            || t.match(/(\d{2,3}(?:\.\d{1,2})?)\s*(?:MHz|兆赫)/i);
  if(marked){
    const v=parseFloat(marked[1]);
    if(v>=FM_MIN&&v<=FM_MAX) return v;
  }
  if(requireMark) return null;
  // 裸数字：971→97.1，1017→101.7，103.9 直接用
  const nums=t.match(/\d{2,4}(?:\.\d{1,2})?/g)||[];
  for(const s of nums){
    if(s.indexOf(".")>=0){
      const v=parseFloat(s);
      if(v>=FM_MIN&&v<=FM_MAX) return v;
    }else if(s.length>=3){
      const v2=parseFloat(s.slice(0,-1)+"."+s.slice(-1));
      if(v2>=FM_MIN&&v2<=FM_MAX) return v2;
      const v=parseFloat(s);
      if(v>=FM_MIN&&v<=FM_MAX) return v;
    }
  }
  return null;
}

// 兜底：按台名算一个稳定的"估算频率"，保证指针一定会动（显示为 ≈）
function estimateFM(stationName){
  let h=0;const s=String(stationName||"电台");
  for(let i=0;i<s.length;i++) h=(h*31+s.charCodeAt(i))>>>0;
  return Math.round((FM_MIN+(h%1000)/1000*(FM_MAX-FM_MIN))*10)/10;
}

// 联网兜底（Radio Browser，国内数据有限，失败不影响使用）
async function fetchFMFromNet(stationName){
  try{
    const servers=["de1.api.radio-browser.info","de2.api.radio-browser.info","nl1.api.radio-browser.info"];
    const server=servers[Math.floor(Math.random()*servers.length)];
    const url=`https://${server}/json/stations/search?name=${encodeURIComponent(stationName)}&limit=8&hidebroken=true&order=votes&reverse=true`;
    const ctl=new AbortController();const timer=setTimeout(()=>ctl.abort(),3500);
    const res=await fetch(url,{headers:{"User-Agent":"PANDA6519-Radio/1.0"},signal:ctl.signal});
    clearTimeout(timer);
    if(!res.ok) return null;
    const data=await res.json();
    if(!Array.isArray(data)) return null;
    const key=normFMName(stationName);
    for(const st of data){
      const nm=normFMName(st&&st.name||"");
      if(nm&&(nm.indexOf(key)>=0||key.indexOf(nm)>=0)){
        const f=parseFMFromText((st.name||"")+" "+(st.tags||""),true);
        if(f) return f;
      }
    }
  }catch(e){ /* 静默失败 */ }
  return null;
}

// 获取用户城市（通过浏览器 Geolocation + 反向地理编码）

// ② 定位进行中时复用同一个 Promise，避免并发换台触发多次弹窗。
async function detectUserCity(){

  if(userCity) return userCity;
  // 正在定位中 → 复用同一次结果，避免并发换台重复调用 getCurrentPosition
  if(cityDetecting) return cityDetecting;

  cityDetecting=new Promise((resolve)=>{
    if(!navigator.geolocation){
      userCity="北京";
      cityDetecting=null;
      resolve(userCity);
      return;
    }
    navigator.geolocation.getCurrentPosition(async(pos)=>{
      try{
        const {latitude,longitude}=pos.coords;
        // 使用 OpenStreetMap Nominatim 反向地理编码（免费，无需 key）
        const url=`https://nominatim.openstreetmap.org/reverse?format=json&lat=${latitude}&lon=${longitude}&zoom=10&accept-language=zh-CN`;
        const res=await fetch(url,{headers:{"User-Agent":"PANDA6519-Radio/1.0"}});
        if(res.ok){
          const data=await res.json();
          userCity=data.address?.city||data.address?.town||data.address?.state||"北京";
        }else{
          userCity="北京";
        }
      }catch(e){
        userCity="北京";
      }
      cityDetecting=null;
      resolve(userCity);
    },(err)=>{
      userCity="北京";
      cityDetecting=null;
      resolve(userCity);
    },{timeout:5000});
  });
  return cityDetecting;
}

// 更新拨号指针到对应 FM 位置
// ★ 统一入口：返回 {fm, exact}，exact=false 表示是估算值
async function resolveFM(stationName,station){
  if(fmCache[stationName]!==undefined) return fmCache[stationName];
  let r=null;
  // 0) 频谱表里写的「频率：」优先，精确到小数点后一位
  if(station&&station.fm) return (fmCache[stationName]={fm:station.fm,exact:true});
  let f=parseFMFromText(stationName,true);                          // 1) 台名自带频率（最可信）
  if(f) r={fm:f,exact:true};
  if(!r){f=lookupLocalFM(stationName); if(f) r={fm:f,exact:true};}  // 2) 内置对照表
  if(!r){f=parseFMFromText(stationName,false); if(f) r={fm:f,exact:true};} // 3) 裸数字
  if(!r){f=await fetchFMFromNet(stationName); if(f) r={fm:f,exact:true};}  // 4) 联网兜底
  if(!r) r={fm:estimateFM(stationName),exact:false};                // 5) 估算兜底，保证指针一定动
  fmCache[stationName]=r;
  return r;
}

// 更新拨号指针到对应 FM 位置
async function updateDialToFM(station){
  if(!fmMode||!station) return;
  displayStatus.textContent="🔍 搜索FM频率...";
  if(!userCity) await detectUserCity();
  const {fm,exact}=await resolveFM(station.name,station);
  if(!isPlaying) return;
  // 与关闭 FM 时同一套映射（20%~80%），指针不会跑出刻度盘
  dialPointer.style.left=`${fmToDialLeft(fm).toFixed(2)}%`;
  displayStatus.textContent=exact?`FM ${fm.toFixed(1)} MHz`:`FM ${fm.toFixed(1)} MHz ≈估算`;
}

// 切换 FM 模式
async function toggleFMMode(){
  fmMode=!fmMode;
  if(fmMode){
    displayStatus.textContent="FM追踪模式 · 已开启";
    // 自动获取城市并开始追踪
    if(!userCity) await detectUserCity();
    if(currentStation) updateDialToFM(currentStation);
  }else{
    displayStatus.textContent=isPlaying?"PLAYING":"READY";
    // 恢复正常指针位置
    if(currentStation){
      const st=currentStation;
      const pct=st._url?(hashCode(st._url)%100):(STATIONS.length>1?(currentStationIndex/(STATIONS.length-1))*100:50);
      dialPointer.style.left=`${20+pct*0.6}%`;
    }
  }
}

fmToggle.addEventListener("click",()=>{

// ════════════════════════════════════════════════════════════════════════════
// VU 表盘绘制
// ★ 刻度部分换成「分段等分」刻度组件（与独立版刻度组件同一套算法）：
//   · 一条分界弧 r = VU_R0 —— 弧之上是 VU 刻度横线，弧之下是百分比圆点
//   · VU 序列：-20 ‖大格‖ -10 · · -7 · -5 · -3 -2 -1 0 1 2 3 · 5 +
//   · 百分比：0% 落在 -20，100% 落在 0 VU，之间弧长五等分（红区不设百分比）
//   · 指针枢轴 = 表盘圆心 (100,100)，与 CSS .vu-needle-wrap 的 50%/50% 重合
// ════════════════════════════════════════════════════════════════════════════
const VU_PIVOT_X=100, VU_PIVOT_Y=100;   // 指针枢轴（200 制 = 表盘圆心）
const VU_R0=74;                          // 分界弧半径
const VU_SPAN=48;                        // 弧半角(度) → 总张角 96°
const VU_BIG=3.5;                        // -20~-10 这个大格占几等份
const VU_DB_L=-20, VU_DB_P=-10, VU_DB_R=6;
const VU_TOTAL=VU_BIG+(VU_DB_R-VU_DB_P); // 19.5 等份 → 每份 96/19.5 ≈ 4.92°

// dB → 弧上位置 0..1（分段等分）
function vuPos(db){
  return db<=VU_DB_P
    ? (db-VU_DB_L)/(VU_DB_P-VU_DB_L)*VU_BIG/VU_TOTAL
    : (VU_BIG+(db-VU_DB_P))/VU_TOTAL;
}
const VU_P0=vuPos(0);                              // 0 VU 位置，同时 = 100% 落点
const vuPosPct=(pc)=>(pc/100)*VU_P0;               // 0% 在 -20，五等分
const vuAng=(p)=>-VU_SPAN+p*2*VU_SPAN;             // 弧上位置 → 角度(度)
const VU_MIN_ANGLE=-VU_SPAN, VU_MAX_ANGLE=VU_SPAN;
function dbToAngle(db){                            // dB → 指针旋转角(度)
  return vuAng(Math.max(0,Math.min(1,vuPos(db))));
}
function polar(cx,cy,r,aDeg){const r2=(aDeg-90)*Math.PI/180;return{x:cx+r*Math.cos(r2),y:cy+r*Math.sin(r2)};}

// 半径分层：按组件比例 k=VU_R0/230 缩放到本表盘
const VU_K=VU_R0/230;
const VU_MAJ_OUT=VU_R0+17*VU_K, VU_MAJ_IN=VU_R0+2*VU_K;   // VU 主刻度横线（只在弧外侧）
const VU_MIN_OUT=VU_R0+11*VU_K, VU_MIN_IN=VU_R0+2*VU_K;   // VU 小刻度横线
const VU_LBL_R=VU_R0+31*VU_K;                              // VU 数字
const VU_DOT_R=VU_R0-13*VU_K, VU_DOT_MAJ=1.5, VU_DOT_MIN=1.0;   // 百分比圆点（弧之下）
const VU_PCT_R=VU_R0-32*VU_K;                              // 百分比数字
const VU_ARC_W=1.2, VU_RED_W=3.0;                          // 分界弧线宽
const VU_RED_OFF=(VU_RED_W-VU_ARC_W)/2;                    // 红弧只向外加粗，内缘与黑弧对齐
const VU_LBL_FS=6.6, VU_PCT_FS=5.2;
const VU_INK="#4a2e1b", VU_RED="#c0281f", VU_PCT_INK="#7a5a30";
const VU_FONT="Arial, Helvetica, sans-serif";
const VU_MAJOR=[[-20,"-20"],[-10,"-10"],[-7,"-7"],[-5,"-5"],[-3,"-3"],[-2,"-2"],
                [-1,"-1"],[0,"0"],[1,"1"],[2,"2"],[3,"3"],[5,"5"]];
const VU_MINOR=[-9,-8,-6,-4,4];                    // 等分自然长出来的小格
const VU_PCT_MAJOR=[0,20,40,60,80,100], VU_PCT_MINOR=[10,30,50,70,90];

function buildVUDial(){
  const A=(deg,r)=>polar(VU_PIVOT_X,VU_PIVOT_Y,r,deg);
  const n=(v)=>v.toFixed(2);
  let s=`<defs>
    <radialGradient id="dialFace" cx="50%" cy="36%" r="70%"><stop offset="0%" stop-color="#fffef4"/><stop offset="48%" stop-color="#faf0d2"/><stop offset="100%" stop-color="#ecd29a"/></radialGradient>
    <linearGradient id="redZone" x1="0%" y1="0%" x2="100%" y2="0%"><stop offset="0%" stop-color="#d8342b"/><stop offset="100%" stop-color="#a01814"/></linearGradient>
    <radialGradient id="copperCoil" cx="50%" cy="50%" r="50%"><stop offset="0%" stop-color="#f5c68a"/><stop offset="60%" stop-color="#c97f3a"/><stop offset="100%" stop-color="#7c4c1e"/></radialGradient>
    <filter id="softShadow" x="-40%" y="-40%" width="180%" height="180%" filterUnits="objectBoundingBox">
      <feDropShadow dx="0" dy="1.4" stdDeviation="1.6" flood-color="#000" flood-opacity="0.4"/>
    </filter>
    <filter id="needleShadow" x="-100%" y="-100%" width="300%" height="300%" filterUnits="objectBoundingBox">
      <feDropShadow dx="0.8" dy="1.2" stdDeviation="1.0" flood-color="#000" flood-opacity="0.35"/>
    </filter>
  </defs>`;
  // 表盘底色
  s+=`<circle cx="100" cy="100" r="98" fill="url(#dialFace)"/>`;

  // ① 分界弧：一条圆弧线 —— 之上是 VU 横线，之下是百分比圆点
  const a0=A(-VU_SPAN,VU_R0), a1=A(dbToAngle(0),VU_R0);
  s+=`<path d="M ${n(a0.x)} ${n(a0.y)} A ${VU_R0} ${VU_R0} 0 0 1 ${n(a1.x)} ${n(a1.y)}" fill="none" stroke="${VU_INK}" stroke-width="${VU_ARC_W}" opacity="0.85" stroke-linecap="round"/>`;
  const rr=VU_R0+VU_RED_OFF;
  const b0=A(dbToAngle(0),rr), b1=A(VU_SPAN,rr);
  s+=`<path d="M ${n(b0.x)} ${n(b0.y)} A ${rr.toFixed(2)} ${rr.toFixed(2)} 0 0 1 ${n(b1.x)} ${n(b1.y)}" fill="none" stroke="url(#redZone)" stroke-width="${VU_RED_W}" stroke-linecap="round" opacity="0.95"/>`;

  // ② 弧之下：百分比圆点（0% 对齐 -20，100% 对齐 0 VU）
  s+=`<g fill="${VU_PCT_INK}">`;
  VU_PCT_MINOR.forEach(pc=>{
    const c=A(vuAng(vuPosPct(pc)),VU_DOT_R);
    s+=`<circle cx="${n(c.x)}" cy="${n(c.y)}" r="${VU_DOT_MIN}"/>`;
  });
  VU_PCT_MAJOR.forEach(pc=>{
    const p=vuPosPct(pc), ang=vuAng(p);
    const c=A(ang,VU_DOT_R), t=A(ang,VU_PCT_R);
    s+=`<circle cx="${n(c.x)}" cy="${n(c.y)}" r="${VU_DOT_MAJ}"/>`;
    const lab = pc===100 ? `100<tspan font-size="${(VU_PCT_FS*0.72).toFixed(1)}">%</tspan>` : String(pc);
    s+=`<text x="${n(t.x)}" y="${n(t.y)}" dy="0.34em" font-family="${VU_FONT}" font-size="${VU_PCT_FS}" font-weight="600" fill="${VU_PCT_INK}" text-anchor="middle">${lab}</text>`;
  });
  s+=`</g>`;

  // ③ 弧之上：VU 刻度横线
  VU_MINOR.forEach(v=>{
    const ang=dbToAngle(v), p1=A(ang,VU_MIN_OUT), p2=A(ang,VU_MIN_IN);
    s+=`<line x1="${n(p1.x)}" y1="${n(p1.y)}" x2="${n(p2.x)}" y2="${n(p2.y)}" stroke="${v>0?VU_RED:VU_INK}" stroke-width="1.1" stroke-linecap="butt"/>`;
  });
  VU_MAJOR.forEach(([v,lab])=>{
    const ang=dbToAngle(v), isZero=(v===0), col=(v>=0?VU_RED:VU_INK);
    const p1=A(ang,isZero?VU_MAJ_OUT+1.6:VU_MAJ_OUT), p2=A(ang,VU_MAJ_IN);
    s+=`<line x1="${n(p1.x)}" y1="${n(p1.y)}" x2="${n(p2.x)}" y2="${n(p2.y)}" stroke="${col}" stroke-width="${isZero?2.4:1.7}" stroke-linecap="butt"/>`;
    const t=A(ang,VU_LBL_R);
    s+=`<text x="${n(t.x)}" y="${n(t.y)}" dy="0.34em" font-family="${VU_FONT}" font-size="${isZero?(VU_LBL_FS+0.8):VU_LBL_FS}" font-weight="${isZero?700:600}" fill="${col}" text-anchor="middle">${lab}</text>`;
  });
  // 末端「+」
  {
    const ang=VU_SPAN, p1=A(ang,VU_MIN_OUT), p2=A(ang,VU_MIN_IN), t=A(ang,VU_LBL_R);
    s+=`<line x1="${n(p1.x)}" y1="${n(p1.y)}" x2="${n(p2.x)}" y2="${n(p2.y)}" stroke="${VU_RED}" stroke-width="1.1" stroke-linecap="butt"/>`;
    s+=`<text x="${n(t.x)}" y="${n(t.y)}" dy="0.34em" font-family="${VU_FONT}" font-size="${VU_LBL_FS}" font-weight="700" fill="${VU_RED}" text-anchor="middle">+</text>`;
  }
  // ④ 扬声器格栅（沿用原设计）
  s+=`<rect x="71" y="88" width="58" height="28" rx="5" fill="#363636" stroke="#1c1c1c" stroke-width="1" opacity="0.93" filter="url(#softShadow)"/>`;
  s+=`<circle cx="100" cy="102" r="14" fill="url(#copperCoil)" stroke="#6e4d1e" stroke-width="0.8"/>`;
  [[78.5,102],[121.5,102]].forEach(([cx,cy])=>{
    s+=`<circle cx="${cx}" cy="${cy}" r="3.8" fill="#3d3d3d" stroke="#1a1a1a" stroke-width="0.6" filter="url(#softShadow)"/>`;
    s+=`<line x1="${cx-2.5}" y1="${cy}" x2="${cx+2.5}" y2="${cy}" stroke="#cfcfcf" stroke-width="0.9" opacity="0.85"/>`;
  });
  vuDial.innerHTML=s;
}
buildVUDial();

// ════════════════════════════════════════════════════════════════════════════
// VU 指针物理
// ════════════════════════════════════════════════════════════════════════════
const VU_ATTACK=0.10,VU_RELEASE=0.32,RMS_WINDOW=0.30;
const VU_REF_RMS=0.25;
const VU_FLOOR_DB=-20,VU_CEIL_DB=5;   // 表盘量程（与刻度 -20 ~ +5 对齐）
const VU_SPAN_DB=VU_CEIL_DB-VU_FLOOR_DB;   // 25dB
let rmsHistory=[],ballistics=0,needleAngle=VU_MIN_ANGLE,needleVel=0,lastFrameTs=0;
let peakHold=0,peakHoldTimer=0;
// ★ PEAK 灯只在真正进入红区（0 VU 以上）时才点，不再"一播放就常亮"
const PEAK_HOLD_THRESHOLD=0.5;
const PEAK_HOLD_MS=260;
// ★ 开机预热：刚开播时指针不许一步跳到目标电平，而是从表盘最左端在
//   VU_WARMUP_SEC 内平滑"站起来"（对应真机灯丝预热 + 表头起摆）
const VU_WARMUP_SEC=1.2;
let vuWarmup=0;
const PEAK_DECAY_DB=5.5;
const PEAK_FALL_SEC=0.85;          // 无信号时 PEAK 灯余辉时长(s)

// ── 机械回零（切台 / 停播时指针"摇回"零位）─────────────────────────
// 真实 VU 表头是「动圈 + 游丝」的二阶机械系统：信号消失后指针不会瞬间掉到零，
// 而是被游丝以有限的力矩缓慢拉回，途中还会因惯性越过零位一点、撞到止动钉再弹回。
// 这里用「欠阻尼弹簧-质点」模型复现这套机械特性：
//   NEEDLE_FALL_PERIOD  回摆周期(s)，越大摇得越慢（1.0~1.6 手感较好）
//   NEEDLE_FALL_ZETA    阻尼比，越小过冲/回摆越明显（1 = 完全不过冲）
//   NEEDLE_FALL_RAMP    起步缓冲(s)：目标位从"当前位置"渐变到零位，
//                       指针因此会先在原地"记住"当前电平，再慢慢往回摇
const NEEDLE_FALL_PERIOD=1.25,NEEDLE_FALL_ZETA=0.68,NEEDLE_FALL_RAMP=0.75;
const NEEDLE_STOP_OVER=3.0;        // 越过零位止钉的余量(deg)，撞钉后小幅反弹
let vuFalling=false;               // 是否处于回零过程
let fallT=0,fallFrom=VU_MIN_ANGLE; // 回零计时 / 起步时记下的电平位置

function pushRMS(v){const now=performance.now()/1000;rmsHistory.push({t:now,v});const cut=now-RMS_WINDOW;while(rmsHistory.length>1&&rmsHistory[0].t<cut)rmsHistory.shift();}
function avgRMS(){if(!rmsHistory.length)return 0;let s=0;for(const x of rmsHistory)s+=x.v;return s/rmsHistory.length;}
function rmsToVUdb(rms){ return 20*Math.log10(Math.max(rms,1e-7)/VU_REF_RMS); }

// ── 模拟电平：拿不到真实音频数据时用它驱动指针 ──────────────────────
// 跨域广播流接进 Web Audio 会被浏览器静音，所以不能真的去分析声音，
// 这里用程序化电平代替；摆幅随音量变化（音量越小，指针摆得越低）。
function simLevelDb(){
  const t=performance.now()/1000;
  let s=0.46+0.20*Math.sin(t*1.7)+0.13*Math.sin(t*4.3+1.1)+0.08*Math.sin(t*9.1+0.4)+0.05*Math.sin(t*0.47+2.2)+0.04*Math.random();
  s=Math.max(0,Math.min(1,s));
  const vol=isMuted?0:userVolume;
  // ★ 旧版是 -20+23*s：s≈0.5 就冲到 -8dB、峰值直接顶到 +3 满刻度。
  //   改成以 -15dB 为底、+2dB 为顶的节目电平，指针停在表盘中左部摆动。
  return (-15+17*s)*(0.34+0.66*vol);
}
function vuStep(dt){
  let rawDb;
  // ① 音源已接入音频总线 → 指针跟真实节目电平走（取样点在 volGain 之前，音量另算）
  if(busAttached&&meterLive&&specLevel>0.0008){
    rawDb=specToDb();
  }else{
    // ② 未接入总线（跨域流无法采集）→ 模拟电平，摆幅同样随音量变化
    rawDb=simLevelDb();
  }
  rawDb=Math.max(VU_FLOOR_DB,Math.min(VU_CEIL_DB,rawDb));
  // ★ 开机预热：目标电平从表盘最左端平滑升到真实电平。
  //   旧版没有这一步，开播瞬间 target 就是满值，指针"啪"一下打到头。
  const targetDb=VU_FLOOR_DB+(rawDb-VU_FLOOR_DB)*vuWarmup;
  const cur = ballistics * VU_SPAN_DB + VU_FLOOR_DB;
  const tau = (targetDb > cur) ? VU_ATTACK : VU_RELEASE;
  const a = 1 - Math.exp(-dt / tau);
  const next = cur + a * (targetDb - cur);
  ballistics = Math.max(0, Math.min(1.02, (next - VU_FLOOR_DB) / VU_SPAN_DB));
  const ta = dbToAngle(next);
  const accel = 180 * (ta - needleAngle) - 12 * needleVel;
  needleVel += accel * dt; needleAngle += needleVel * dt;
  if (needleAngle < VU_MIN_ANGLE - 2) { needleAngle = VU_MIN_ANGLE - 2; needleVel = 0; }
  if (needleAngle > VU_MAX_ANGLE + 2) { needleAngle = VU_MAX_ANGLE + 2; needleVel *= -0.3; }
  return { angle: needleAngle, db: next };
}

// ── 无信号时的机械回零 ────────────────────────────────────────────
// 切台 / 停播时走这里：指针从"当前停住的位置"出发，被游丝缓慢拉回零位，
// 途中会因惯性越过零位一点、撞到止动钉再弹回，不会瞬间归零。
// 进入回零时不要清 needleAngle / ballistics —— 那正是"要记住的当前位置"。
// force=true 用于"切台/停播"这类明确时刻：不管之前有没有在回落，
// 都以指针当前所在位置为起点重新起步（否则会沿用上一次记下的旧位置，指针直接掉下去）
function enterFall(force){
  if(vuFalling&&!force) return;
  vuFalling=true;
  fallT=0;
  fallFrom=needleAngle;          // ★ 记下当前位置：回零从这里起步
}
function vuFallStep(dt){
  fallT+=dt;
  // 起步缓冲：目标位从"当前位置"平滑滑到零位。
  // 用 ramp² 的缓入曲线 —— 前段目标几乎不动，指针就先"站"在切台那一刻的位置上，
  // 之后才越走越快被游丝拉回去（比线性更像游丝逐渐释放力矩）。
  const ramp=Math.min(1,fallT/Math.max(0.05,NEEDLE_FALL_RAMP));
  const target=fallFrom+(VU_MIN_ANGLE-fallFrom)*ramp*ramp;
  // 欠阻尼弹簧：ω 决定回摆快慢，ζ 决定过冲幅度
  const w=2*Math.PI/NEEDLE_FALL_PERIOD;
  const accel=w*w*(target-needleAngle)-2*NEEDLE_FALL_ZETA*w*needleVel;
  needleVel+=accel*dt;
  needleAngle+=needleVel*dt;
  // 零位止动钉：撞钉后小幅反弹，不会一路穿下去
  if(needleAngle<VU_MIN_ANGLE-NEEDLE_STOP_OVER){needleAngle=VU_MIN_ANGLE-NEEDLE_STOP_OVER;needleVel*=-0.22;}
  if(needleAngle>VU_MAX_ANGLE+NEEDLE_STOP_OVER){needleAngle=VU_MAX_ANGLE+NEEDLE_STOP_OVER;needleVel*=-0.22;}
  // 电平记忆量 ballistics 跟着指针一起回落：重新收到信号时才能从当前位置平滑接上，不跳变
  const bFrom=(needleAngle-VU_MIN_ANGLE)/(VU_MAX_ANGLE-VU_MIN_ANGLE);
  ballistics+=((bFrom<0?0:bFrom>1?1:bFrom)-ballistics)*(1-Math.exp(-dt/(NEEDLE_FALL_PERIOD*0.6)));
  return { angle: needleAngle, db: ballistics*VU_SPAN_DB+VU_FLOOR_DB };
}
function startVULoop(){
  const loop=(ts)=>{
    const dt=lastFrameTs?Math.min(0.05,(ts-lastFrameTs)/1000):0.016;lastFrameTs=ts;
    if(isPlaying&&!isMuted&&userVolume>0){
      vuFalling=false;                 // 有信号 → 退出回零，指针从当前位置继续走
      if(vuWarmup<1) vuWarmup=Math.min(1,vuWarmup+dt/VU_WARMUP_SEC);   // 开机预热推进
      const {angle,db}=vuStep(dt);
      vuNeedle.style.transform=`rotate(${angle.toFixed(2)}deg)`;
      if(db>=PEAK_HOLD_THRESHOLD){peakHold=1;peakHoldTimer=PEAK_HOLD_MS;vuPeak.classList.add("on");}
      else if(peakHoldTimer>0){peakHoldTimer-=dt*1000;if(peakHoldTimer<=0){peakHold=1;}}
      else{peakHold=Math.max(0,peakHold-PEAK_DECAY_DB*dt/PEAK_HOLD_THRESHOLD);}
      if(peakHold<0.08){vuPeak.classList.remove("on");}
    }else{
      // ★ 无信号：进入机械回零（旧行为是 needleAngle 直接打到零位 —— 瞬间归零）
      enterFall();
      const {angle}=vuFallStep(dt);
      vuNeedle.style.transform=`rotate(${angle.toFixed(2)}deg)`;
      // PEAK 灯留一段余辉再熄灭，和指针一起"退场"
      peakHoldTimer=0;
      peakHold=Math.max(0,peakHold-dt/PEAK_FALL_SEC);
      if(peakHold<0.08){vuPeak.classList.remove("on");}
    }
    requestAnimationFrame(loop);
  };
  requestAnimationFrame(loop);
}
startVULoop();

// ════════════════════════════════════════════════════════════════════════════
// 音频总线（Audio Bus）
// ════════════════════════════════════════════════════════════════════════════
// 所有音源统一接入这条链路，再由它播放出去；VU 指针读的就是这条链路上的频谱：
//
//   媒体元素 audio
//     └→ srcNode(MediaElementAudioSource)
//          └→ preGain(输入微调)
//               └→ analyser(频谱采集)   ← 指针读这里
//                    └→ volGain(音量旋钮，受 userVolume / isMuted 控制)
//                         └→ destination(扬声器)
//
// 为什么采集点放在音量「之前」：
//   这样频谱反映的是电台本身的信号强度，音量旋钮再由指针算法单独叠加，
//   AGC 只跟踪电台响度、不会被音量带跑 —— 音量调小，指针是真的压低。
//
// 安全性：本页 audio 元素带 crossorigin="anonymous"，没有 CORS 头的流根本加载不了；
//   能成功播放就说明 CORS 已通过，接入这条链路不会被浏览器静音。
//   blob / data / 同源（hls.js 走 MSE 正是 blob）同样安全。
//   万一判断失误，startBusWatch() 会在 2.5 秒内检测到「静音」并自动退出总线。
// ════════════════════════════════════════════════════════════════════════════

// ★ 总开关：想彻底回到「原生播放 + 模拟指针」，把 true 改成 false 即可
const ENABLE_AUDIO_BUS = true;

// ── 表头标定（想微调手感，只改这一段）──────────────────────────────
// 基准偏移：相对响度达到参考点时指针读多少 dB（越负，指针整体越偏左）
const SPEC_TRIM_DB = -5;
// 灵敏度：1=忠实还原，>1=摆得更夸张。
// ★ 旧版 2.2 会把每一点起伏翻倍，是"一播放就拉满"的元凶之一。
const SPEC_GAIN = 1.15;
// AGC 参考点：相对响度 rel=0.72 时读作 SPEC_TRIM_DB
const SPEC_AGC_REF = 0.72;
// 软压缩拐点(dB)：超出后渐近饱和，指针不会硬顶在满刻度上"钉住"
const SPEC_COMPRESS_DB = 16;
// 音量对指针的影响强度：1=完全线性（音量 30% 指针几乎到底），0.6=温和（推荐）
// 设 0 则指针完全不受音量影响
const VOL_INFLUENCE = 0.6;
// AGC 时间常数(s)：开播锁定 / 之后上升 / 之后回落
const AGC_LOCK_TAU=0.12, AGC_RISE_TAU=2.5, AGC_FALL_TAU=9.0;
const AGC_FLOOR=0.012;
let lastSpecDt=0.016;       // 供 AGC 使用的帧间隔

let audioCtx=null,srcNode=null,preGain=null,volGain=null,analyser=null;
let specAnalyser=null;          // 频谱专用采集节点（挂在 analyser 之后，参数独立）
let freqData=null,timeData=null,floatData=null;
let busAttached=false;      // 音源是否已接入总线
let busWatch=null;          // 静音监测计时器
let specLevel=0;            // 当前节目电平（时域 RMS，未乘音量）
let specPeak=AGC_FLOOR;     // AGC 跟踪到的近期峰值（同样未乘音量）
let agcLocked=false,agcLockT=0;
let specLoopId=null,specLoopActive=false,lastSpecTs=0;

// ── 音源安全性判定 ────────────────────────────────────────────
// 判定依据：本页的 audio 元素带 crossorigin="anonymous" ——
//  · 无 CORS 头的流根本加载不了（会直接报错），走不到这里；
//  · 能成功播放，就说明 CORS 校验已通过，媒体是 CORS-clean 的，
//    接入 Web Audio 不会被浏览器静音。
//  · blob:/data:/同源（hls.js 的 MSE 就是 blob）天然安全。
function isTapSafe(){
  if(!ENABLE_AUDIO_BUS) return false;
  const s=audio.currentSrc||audio.src||"";
  if(!s||s===window.location.href) return false;
  if(/^blob:/i.test(s)||/^data:/i.test(s)) return true;
  try{
    if(new URL(s,window.location.href).origin===window.location.origin) return true;
  }catch(_){}
  try{ return !audio.error && audio.readyState>=2; }catch(_){ return false; }
}

// ── 用户手势标记 ──────────────────────────────────────────────
// 没有用户手势时创建的 AudioContext 会是 suspended，此时把音源接进总线
// 等于直接静音（元素输出被接管，却没人播出去）。手势发生前一律不接管。
let userGestured=false;
function markGesture(){
  if(userGestured){ resumeAudioCtx(); return; }
  userGestured=true;
  resumeAudioCtx();
  if(isPlaying) tryAttach();          // 补接：之前因缺手势没接上的
}
["pointerdown","mousedown","touchstart","keydown"].forEach(ev=>{
  window.addEventListener(ev,markGesture,{passive:true});
});

let busTried=false;    // 已尝试过接管（成败都记）——杜绝二次 createMediaElementSource 抛错
let meterLive=false;   // 是否真的采到节目电平（false → 指针走模拟电平，声音不受影响）
let silentFrames=0;
let audioCtxDead=false;// 极端兜底后不再建总线

// 建总线（只建一次）
function initAudioGraph(){
  if(audioCtx||audioCtxDead) return;
  try{
    const Ctx=window.AudioContext||window.webkitAudioContext;if(!Ctx)return;
    audioCtx=new Ctx();
    preGain=audioCtx.createGain(); preGain.gain.value=1;
    volGain=audioCtx.createGain(); volGain.gain.value=1;
    analyser=audioCtx.createAnalyser();
    analyser.fftSize=1024;                 // 512 个频点，足够细腻
    analyser.smoothingTimeConstant=0.72;   // 平滑，指针不会抖成筛子
    // ── 频谱专用节点：串在 analyser 之后 ──
    // AnalyserNode 是纯旁路（pass-through），多挂一个不影响链路电平，
    // 指针那条支路的 fftSize / smoothing / 取值一律没动。
    specAnalyser=audioCtx.createAnalyser();
    specAnalyser.fftSize=2048;                 // 1024 个频点：低频段分辨率更细
    specAnalyser.smoothingTimeConstant=0.80;   // 比指针更黏一点，柱子不会乱跳
    specAnalyser.minDecibels=-92;              // 默认 -100~-30 会把广播节目压成一片顶格
    specAnalyser.maxDecibels=-18;
    freqData=new Uint8Array(analyser.frequencyBinCount);
    timeData=new Uint8Array(analyser.fftSize);
    buildSpecBands();
  }catch(e){audioCtx=null;analyser=null;specAnalyser=null;srcNode=null;}
}

// 把音源接入总线（一个媒体元素只能 createMediaElementSource 一次，故只做一次）
//
// ★★ 铁律：接管之后【永远不要】srcNode.disconnect()。
//    MediaElementSource 一旦建立，元素的音频输出就被永久重定向到 AudioContext，
//    disconnect 并不会把它还给扬声器，只会让声音彻底消失 ——
//    这正是旧版"切几次台就没声音、界面却显示 PLAYING"的根因：
//    某次采样为 0 触发了 detachAudioBus()，之后再也接不回来。
//    失去信号的正确做法是 bypassAudioBus()：链路原样保留，只是不再拿它控制音量。
function attachAudioBus(){
  if(busAttached) return true;
  if(busTried||!ENABLE_AUDIO_BUS||audioCtxDead) return false;
  if(!userGestured) return false;                  // 无手势 → 不接管，宁可走原生播放
  initAudioGraph();
  if(!audioCtx||!analyser) return false;
  if(audioCtx.state!=="running"){ resumeAudioCtx(); return false; }  // 等它 running 再接
  if(!isTapSafe()) return false;
  busTried=true;
  try{
    srcNode=audioCtx.createMediaElementSource(audio);
    srcNode.connect(preGain);
    preGain.connect(analyser);
    // 频谱节点串在指针采集点之后：两条支路各取所需，互不干扰
    if(specAnalyser){ analyser.connect(specAnalyser); specAnalyser.connect(volGain); }
    else analyser.connect(volGain);
    volGain.connect(audioCtx.destination);
    busAttached=true;
    volGain.gain.value=1;               // 音量交给元素，总线不做二次衰减
    applyOutputVolume();
    startSpecLoop();
    startMeterWatch();
    return true;
  }catch(e){ srcNode=null; busAttached=false; return false; }
}
function tryAttach(){ try{ attachAudioBus(); }catch(_){} }

// ★ 采不到信号时的正确处理：整条链路原样保留，只把采集降级为模拟电平。
//   声音照常从链路输出 —— 这才是"宁可指针不准，也不能没声音"。
function bypassAudioBus(reason){
  if(!busAttached) return;
  meterLive=false;
  if(volGain&&audioCtx){
    try{ volGain.gain.cancelScheduledValues(audioCtx.currentTime); }catch(_){}
    try{ volGain.gain.setValueAtTime(1,audioCtx.currentTime); }catch(_){ try{volGain.gain.value=1;}catch(__){} }
  }
  applyOutputVolume();
  if(reason) console.info("[PANDA] 电平采集降级为模拟模式：",reason);
}

// 采样确认：接上总线 3 秒仍采不到能量 → 只降级采集，绝不动链路
let meterWatch=null;
function startMeterWatch(){
  clearTimeout(meterWatch);
  meterWatch=setTimeout(()=>{
    if(busAttached&&isPlaying&&!meterLive&&!isMuted&&userVolume>0.05&&audioCtx&&audioCtx.state==="running"){
      bypassAudioBus("未采到节目电平");
    }
  },3000);
}

function resumeAudioCtx(){
  if(audioCtx&&audioCtx.state!=="running"){
    try{ const p=audioCtx.resume(); if(p&&p.catch)p.catch(()=>{}); }catch(_){}
  }
}

// 音量：统一由 audio.volume 控制。MediaElementSource 会继承元素的音量，
// 所以即便接了总线，audio.volume 依旧生效；volGain 恒为 1，
// 少一个"可能被设成 0 导致静音"的故障点。
function applyOutputVolume(){
  const v=Math.max(0,Math.min(1,isMuted?0:userVolume));
  try{ audio.muted=false; }catch(_){}
  try{ audio.volume=v; }catch(_){}
  if(busAttached&&volGain&&audioCtx){ try{ volGain.gain.value=1; }catch(_){} }
}

// ═══ 播放健康守护 ═══════════════════════════════════════════════
// ① AudioContext 被挂起（切标签页 / 系统休眠 / 自动播放策略）→ 立刻 resume
// ② currentTime 长时间不推进 → 判定卡流，自动换源重连（最多 2 次）
// ③ 早先缺手势或 ctx 未 running 没接上总线的 → 条件满足时补接
// ④ ctx 长时间救不回来 → 彻底释放总线，把输出还给原生管线（保声音优先）
let healthTimer=null,lastPlayPos=-1,stallTicks=0,retryCount=0,suspTicks=0;
function startHealthWatch(){
  if(healthTimer) return;
  lastPlayPos=-1;stallTicks=0;suspTicks=0;
  healthTimer=setInterval(()=>{
    resumeAudioCtx();
    if(audioCtx&&audioCtx.state!=="running"){
      suspTicks++;
      if(suspTicks>=10&&busAttached){ suspTicks=0; releaseAudioBus(); }
    }else{
      suspTicks=0;
      if(isPlaying&&!busAttached&&!busTried&&!audioCtxDead&&userGestured&&audioCtx) tryAttach();
    }
    if(!isPlaying||audio.paused){ stallTicks=0; return; }
    const pos=audio.currentTime;
    if(pos===lastPlayPos){
      stallTicks++;
      if(stallTicks>=8){                       // ≈8 秒没推进 → 卡流
        stallTicks=0;
        if(currentStation&&retryCount<2){
          retryCount++;
          console.warn("[PANDA] 播放卡住，自动换源重连 ("+retryCount+")");
          displayStatus.textContent="RECONNECTING...";
          rotateUrlAndRestart();
        }
      }
    }else{ stallTicks=0; retryCount=0; }
    lastPlayPos=pos;
  },1000);
}
function stopHealthWatch(){ clearInterval(healthTimer); healthTimer=null; }

// 把当前这条源挪到队尾再重连（只有一条源时就重试它自己）
function rotateUrlAndRestart(){
  const st=currentStation; if(!st||!st.urls||!st.urls.length) return;
  const u=st.urls[currentUrlIdx];
  if(u){ markDead(u); }                 // 卡住的源本次会话不再重试，刷新解禁
  if(u&&st.urls.length>1){
    const arr=st.urls.filter(x=>x!==u); arr.push(u); st.urls=arr;
  }
  startPlayback(st,currentUrlIdx);
}

// 极端兜底：ctx 怎么都救不回来时，关掉它并彻底放弃总线。
// 关闭 AudioContext 会让 MediaElementSource 失效，元素输出回到原生管线 ——
// 宁可丢掉"真实电平"，也绝不留一个静音的界面。
function releaseAudioBus(){
  if(!busAttached) return;
  console.warn("[PANDA] AudioContext 不可用，释放音频总线以确保出声");
  try{ audioCtx.close(); }catch(_){}
  audioCtx=null;srcNode=null;preGain=null;volGain=null;analyser=null;specAnalyser=null;
  freqData=null;timeData=null;floatData=null;specFreqBuf=null;
  busAttached=false;busTried=true;audioCtxDead=true;meterLive=false;specLevel=0;
  stopSpecLoop();
  applyOutputVolume();
  if(currentStation) rotateUrlAndRestart();
}

// 诊断钩子：控制台执行 __pandaDiag() 可一眼看清音频链路状态，
// 万一再遇到"界面在播却没声音"，先看这个再判断是哪一环出了问题。
window.__pandaDiag=function(){
  return {
    busAttached:busAttached, busTried:busTried, meterLive:meterLive, gested:userGestured,
    ctx:audioCtx?audioCtx.state:"none", srcNode:!!srcNode,
    vol:audio.volume, muted:audio.muted, paused:audio.paused, ct:audio.currentTime,
    src:(audio.currentSrc||"").slice(0,90), playing:isPlaying,
    station:currentStation&&currentStation.name, urlIdx:currentUrlIdx, spec:specLevel
  };
};

// ═══ 节目电平取样 ═══
// ★ 关键修正：旧版拿 getByteFrequencyData（频谱）当电平用 —— 这是错的。
//   频域 byte 是把 -100~-30dB 的幅度线性压到 0~255，广播节目几乎每个频点
//   都在 150~255，算出来的"能量"常年 0.6~0.95 且几乎不随内容变化，
//   指针只好一直顶在高位不动。VU 表测的是**时域节目电平 RMS**，
//   这里改用 getFloatTimeDomainData 直接算，动态范围回到真实的 0.01~0.3。
function readProgramLevel(){
  if(!analyser||!busAttached) return 0;
  if(!timeData||timeData.length!==analyser.fftSize) timeData=new Uint8Array(analyser.fftSize);
  if(!floatData){ try{ floatData=new Float32Array(analyser.fftSize); }catch(_){ floatData=null; } }
  let sum=0,n=0;
  if(floatData&&analyser.getFloatTimeDomainData){
    analyser.getFloatTimeDomainData(floatData);
    for(let i=0;i<floatData.length;i++){const v=floatData[i];sum+=v*v;n++;}
  }else{
    analyser.getByteTimeDomainData(timeData);
    for(let i=0;i<timeData.length;i++){const v=(timeData[i]-128)/128;sum+=v*v;n++;}
  }
  return n?Math.sqrt(sum/n):0;
}

// AGC：跟踪近期峰值，把不同电台的响度拉到同一量级（真机里也有 AGC 电路）
// ★ 关键修正：旧版 specPeak 从 0.06 起步、每帧只上浮 1.5%，
//   开播头几秒 rel = specLevel/specPeak 高达 8~10 倍 → +20dB 以上 →
//   指针直接打到头、PEAK 灯常亮。现在开播先用 0.12s 时间常数"快速锁定"，
//   锁定后再转入慢速跟踪（上升 2.5s / 回落 9s），节目本身的起伏得以保留。
function updateSpecAGC(e,dt){
  let tau;
  if(!agcLocked){
    tau=AGC_LOCK_TAU;
    if(Math.abs(e-specPeak)<Math.max(0.004,specPeak*0.2)) agcLockT+=(dt||0.016);
    else agcLockT=0;
    if(agcLockT>0.3) agcLocked=true;
  }else{
    tau=(e>specPeak)?AGC_RISE_TAU:AGC_FALL_TAU;   // 上升快、回落慢
  }
  const a=1-Math.exp(-(dt||0.016)/tau);
  specPeak+=(e-specPeak)*a;
  specPeak=Math.max(AGC_FLOOR,Math.min(1,specPeak));
}

// 节目电平 → VU 表 dB
// · 先按 AGC 峰值归一化，得到「相对响度」rel
// · 再做软压缩：超出拐点后渐近饱和，指针不会硬顶在满刻度上
// · 最后叠加音量旋钮 —— 音量调小，指针就真的压低（AGC 不会把它补偿回去）
function specToDb(){
  updateSpecAGC(specLevel,lastSpecDt);
  const vol=isMuted?0:userVolume;
  if(vol<=0) return VU_FLOOR_DB;                            // 静音 → 指针归零
  const rel=specLevel/Math.max(specPeak,1e-4);              // 相对近期峰值的响度
  const x=20*Math.log10(Math.max(rel,1e-4)/SPEC_AGC_REF);
  const comp=SPEC_COMPRESS_DB*Math.tanh(x/SPEC_COMPRESS_DB); // 软压缩
  const volDb=20*Math.log10(Math.max(vol,1e-3))*VOL_INFLUENCE;
  return comp*SPEC_GAIN+volDb+SPEC_TRIM_DB;
}

function specLoop(){
  if(!analyser){specLoopActive=false;specLoopId=null;return;}
  lastSpecTs=0;
  const tick=(ts)=>{
    if(!specLoopActive){specLoopId=null;return;}
    const dt=lastSpecTs?Math.min(0.05,(ts-lastSpecTs)/1000):0.016;lastSpecTs=ts;
    lastSpecDt=dt;
    specLevel=readProgramLevel();
    pushRMS(specLevel);
    // 连续采到能量才算"真实电平可用"；偶发的静音片段不会立刻降级
    if(specLevel>0.0008){ silentFrames=0; meterLive=true; }
    else if(++silentFrames>150){ meterLive=false; }
    specLoopId=requestAnimationFrame(tick);
  };
  tick();
}
function stopSpecLoop(){specLoopActive=false;if(specLoopId){cancelAnimationFrame(specLoopId);specLoopId=null;}rmsHistory.length=0;specLevel=0;lastSpecTs=0;}
function startSpecLoop(){
  initAudioGraph();
  if(busAttached){ if(specLoopActive)return; specLoopActive=true; specLoop(); }
}
// 停播后的收尾：只负责清掉历史采样，指针位置交给 rAF 主循环的机械回零处理，
// 不再在这里强行衰减 ballistics / needleVel（否则会和弹簧模型打架，回摆被截断）
function startIdleReturn(){
  const idle=setInterval(()=>{
    if(!isPlaying||isMuted||userVolume===0){rmsHistory.length=0;}
    else{clearInterval(idle);return;}
    if(Math.abs(needleAngle-VU_MIN_ANGLE)<0.3&&Math.abs(needleVel)<0.5){clearInterval(idle);}
  },60);
}

// ════════════════════════════════════════════════════════════════════════════
// 频谱窗（Spectrum Window）—— 表盘下缘弧形柱
// ════════════════════════════════════════════════════════════════════════════
// 采集支路（唯一改动是在 analyser 之后多串了一个旁路节点）：
//   媒体元素 → srcNode → preGain → analyser(时域·指针) → specAnalyser(频域·频谱) → volGain → 扬声器
//
// ★ 指针那条链路的 fftSize / smoothing / AGC / ballistics 全部原样未动，
//   specToDb() 每帧读到的 specLevel 与加频谱之前逐帧一致 ——
//   开机预热、起摆、机械回零、过冲回弹、PEAK 余辉，一切照旧。
//
// ★ 为什么"不管什么源"都采得到真实频谱：
//   本页 <audio crossorigin="anonymous"> —— 没有 CORS 头的流根本播不出来；
//   能播 ⇒ 媒体是 CORS-clean ⇒ 接进 Web Audio 不会被浏览器静音。
//   hls.js 走 MSE（blob:）是同源，天然安全。
//   只有 AudioContext 本身建不起来 / 被策略挂死时才会降级（见下）。

const SPEC_BARS=28;               // 柱子数
const SPEC_HALF_ARC=35;           // 弧形半张角（相对正下方，度）
const SPEC_R_BASE=94;             // 柱基座半径（200 制；表盘半径 98）
const SPEC_BAR_MAX=22;            // 柱最大长度 → 顶端半径 72，不碰铭牌与刻度弧
const SPEC_BAR_W=2.4;             // 柱宽
const SPEC_F_LO=40,SPEC_F_HI=9000;// 显示频段（Hz）：广播/语音的主要能量区
const SPEC_ATTACK=0.045;          // 柱子上冲时间常数(s)：快
const SPEC_RELEASE=0.24;          // 柱子回落时间常数(s)：慢
const SPEC_CAP_FALL=0.55;         // 峰值帽下落速度（满量程/秒）
const SPEC_AGC_RISE=0.25;         // 频谱 AGC：上升（开播快速锁定，避免头一秒整排顶格）
const SPEC_AGC_FALL=4.5;          // 频谱 AGC：回落
const SPEC_AGC_FLOOR=42;          // AGC 参考底噪（byte），防止静音时把噪声放大
const SPEC_TILT_DB_PER_OCT=3.4;   // 高频补偿（dB/八度）：节目高频天然偏弱，抬一点才不"一头沉"

const specCanvas=document.getElementById("vuSpectrum");
const specCtx=specCanvas?specCanvas.getContext("2d"):null;
let specDrawScale=1.36;           // 200 制 → 画布像素
let specFreqBuf=null,specBands=null,specBinHz=23.4;
let specAgcPeak=SPEC_AGC_FLOOR;
const specBar=new Float32Array(SPEC_BARS);   // 当前柱高（0~1）
const specCap=new Float32Array(SPEC_BARS);   // 峰值帽（0~1）
const specTarget=new Float32Array(SPEC_BARS);// 本帧目标值
let specLastTs=0,specVisibleW=0;

// 对数频率分桶：低频给足分辨率、高频合并 —— 听感上才是"均匀"的
function buildSpecBands(){
  const bins=specAnalyser?specAnalyser.frequencyBinCount:1024;
  const sr=(audioCtx&&audioCtx.sampleRate)?audioCtx.sampleRate:48000;
  specBinHz=(sr/2)/bins;
  specBands=new Array(SPEC_BARS);
  for(let i=0;i<SPEC_BARS;i++){
    const f0=SPEC_F_LO*Math.pow(SPEC_F_HI/SPEC_F_LO,i/SPEC_BARS);
    const f1=SPEC_F_LO*Math.pow(SPEC_F_HI/SPEC_F_LO,(i+1)/SPEC_BARS);
    let a=Math.floor(f0/specBinHz),b=Math.ceil(f1/specBinHz);
    a=Math.max(1,Math.min(bins-1,a));
    b=Math.max(a+1,Math.min(bins,b));
    specBands[i]=[a,b];
  }
}

// ── 真实采集 ────────────────────────────────────────────────────────────
// 用频域数据（getByteFrequencyData）：这里画的是"频谱"，就该用频域；
// 指针那边用时域 RMS 算节目电平，两者的分工本来就不一样。
function readSpectrumBars(){
  if(!specAnalyser) return false;
  if(!specBands) buildSpecBands();
  if(!specFreqBuf||specFreqBuf.length!==specAnalyser.frequencyBinCount)
    specFreqBuf=new Uint8Array(specAnalyser.frequencyBinCount);
  specAnalyser.getByteFrequencyData(specFreqBuf);
  const minDb=specAnalyser.minDecibels,maxDb=specAnalyser.maxDecibels;
  const span=Math.max(1,maxDb-minDb);
  let peak=0;
  for(let i=0;i<SPEC_BARS;i++){
    const band=specBands[i];let v=0;
    for(let k=band[0];k<band[1];k++) if(specFreqBuf[k]>v) v=specFreqBuf[k];
    // 高频补偿：按"每个八度 +SPEC_TILT_DB_PER_OCT dB"在 dB 域抬升。
    // 节目素材天然低频厚、高频薄（音乐约 -3~-4.5dB/oct），不补偿的话
    // 频谱永远是一根柱子顶天、右边全趴着。
    const fc=Math.sqrt(SPEC_F_LO*SPEC_F_HI*Math.pow(SPEC_F_HI/SPEC_F_LO,(2*i+1)/SPEC_BARS-1));
    const db=minDb+(v/255)*span+SPEC_TILT_DB_PER_OCT*Math.log(Math.max(1,fc)/SPEC_F_LO)/Math.LN2;
    v=Math.max(0,Math.min(255,(db-minDb)/span*255));
    specTarget[i]=v/255;
    if(v>peak) peak=v;
  }
  // 全局 AGC：只做整体缩放，不改动频谱形状（哪段强哪段弱照旧）。
  // ÷1.08 留一点余量，最强的一根顶到 0.93 左右而不是死死贴满。
  const tau=(peak>specAgcPeak)?SPEC_AGC_RISE:SPEC_AGC_FALL;
  specAgcPeak+=(peak-specAgcPeak)*(1-Math.exp(-(lastSpecDt||0.016)/tau));
  specAgcPeak=Math.max(SPEC_AGC_FLOOR,Math.min(255,specAgcPeak));
  const norm=255/(Math.max(SPEC_AGC_FLOOR,specAgcPeak)*1.08);
  let energy=0;
  for(let i=0;i<SPEC_BARS;i++){
    specTarget[i]=Math.max(0,Math.min(1,specTarget[i]*norm));
    energy+=specTarget[i];
  }
  return energy>0.05;             // 真的有东西才认"已采到"
}

// ── 降级：程序化频谱 ────────────────────────────────────────────────────
// 与指针的 simLevelDb() 是同一套降级哲学：拿不到真实数据就用节目包络驱动，
// 视觉不塌、逻辑一致。柱色偏冷（见 drawSpectrum）以示区别。
let specSimP1=0.18,specSimP2=0.52,specSimP3=0.80;
function simSpectrumBars(){
  const t=performance.now()/1000;
  const vol=isMuted?0:userVolume;
  const env=(0.46+0.20*Math.sin(t*1.7)+0.13*Math.sin(t*4.3+1.1)+0.08*Math.sin(t*9.1+0.4)+0.05*Math.sin(t*0.47+2.2))*(0.34+0.66*vol);
  specSimP1=0.16+0.12*Math.sin(t*0.53);
  specSimP2=0.50+0.20*Math.sin(t*0.31+1.7);
  specSimP3=0.79+0.10*Math.sin(t*0.23+3.1);
  for(let i=0;i<SPEC_BARS;i++){
    const f=i/(SPEC_BARS-1);
    let v=0.64*Math.exp(-2.0*f)+0.05;                       // 节目频谱倾斜：低频厚、高频薄
    v+=0.34*Math.exp(-Math.pow((f-specSimP1)/0.11,2));      // 游走的"乐音峰"
    v+=0.26*Math.exp(-Math.pow((f-specSimP2)/0.15,2));
    v+=0.16*Math.exp(-Math.pow((f-specSimP3)/0.09,2));
    specTarget[i]=Math.max(0,Math.min(1,v*Math.max(0,Math.min(1.15,env*1.5))));
  }
}

// ── 画布尺寸：跟随 devicePixelRatio 与全屏缩放重建，4K 下边缘依旧锐利 ──
function resizeSpecCanvas(){
  if(!specCanvas) return;
  const rect=vuMeter.getBoundingClientRect();
  const cssW=rect.width||272;
  if(cssW<=0) return;
  const dpr=Math.min(window.devicePixelRatio||1,3);
  const boost=Math.max(1,cssW/272);                          // 全屏放大倍率
  const px=Math.round(272*boost*dpr);
  if(Math.abs(cssW-specVisibleW)>0.5||specCanvas.width!==px){
    specCanvas.width=px;specCanvas.height=px;
    specDrawScale=px/200;                                    // 统一用 200 制坐标作图
    specVisibleW=cssW;
  }
}

// ── 绘制 ────────────────────────────────────────────────────────────────
// 极坐标约定：正下方为 θ=0，向两侧展开 ±SPEC_HALF_ARC；
// 半径为"距圆心距离"，柱基座在外圈 r=94，向内（减小 r）生长。
function drawSpectrum(live){
  if(!specCtx) return;
  const S=specDrawScale;
  specCtx.setTransform(1,0,0,1,0,0);
  specCtx.clearRect(0,0,specCanvas.width,specCanvas.height);
  specCtx.setTransform(S,0,0,S,0,0);
  specCtx.lineCap="round";

  // 基座基准弧：一条细的暗色弧，把"频谱窗"框出来
  specCtx.strokeStyle="rgba(92,60,26,0.30)";
  specCtx.lineWidth=0.55;
  specCtx.beginPath();
  specCtx.arc(100,100,SPEC_R_BASE,(90-SPEC_HALF_ARC)*Math.PI/180,(90+SPEC_HALF_ARC)*Math.PI/180);
  specCtx.stroke();

  const liveA=live;
  for(let i=0;i<SPEC_BARS;i++){
    const th=(-SPEC_HALF_ARC+(2*SPEC_HALF_ARC)*((i+0.5)/SPEC_BARS))*Math.PI/180;
    const sn=Math.sin(th),cs=Math.cos(th);
    const bx=100+sn*SPEC_R_BASE, by=100+cs*SPEC_R_BASE;
    const topR=SPEC_R_BASE-SPEC_BAR_MAX;

    // ① 槽底（未点亮的部分）
    specCtx.strokeStyle="rgba(96,62,26,0.15)";
    specCtx.lineWidth=SPEC_BAR_W;
    specCtx.beginPath();specCtx.moveTo(bx,by);
    specCtx.lineTo(100+sn*topR,100+cs*topR);specCtx.stroke();

    // ② 柱体
    const v=specBar[i];
    if(v>0.012){
      const len=SPEC_BAR_MAX*v;
      const tx=100+sn*(SPEC_R_BASE-len), ty=100+cs*(SPEC_R_BASE-len);
      const g=specCtx.createLinearGradient(bx,by,tx,ty);
      if(liveA){ g.addColorStop(0,"#8a5416");g.addColorStop(0.45,"#d97a1c");g.addColorStop(1,"#ffc44d"); }
      else     { g.addColorStop(0,"#6b5a3a");g.addColorStop(0.45,"#9a8660");g.addColorStop(1,"#c8b183"); }
      specCtx.strokeStyle=g;
      specCtx.lineWidth=SPEC_BAR_W;
      specCtx.beginPath();specCtx.moveTo(bx,by);specCtx.lineTo(tx,ty);specCtx.stroke();
    }

    // ③ 峰值帽：停留后缓慢下落，和指针的 PEAK 余辉同一套语言
    const c=specCap[i];
    if(c>0.02){
      const cr=SPEC_R_BASE-SPEC_BAR_MAX*c;
      specCtx.strokeStyle=liveA?"rgba(255,214,120,0.88)":"rgba(214,198,160,0.75)";
      specCtx.lineWidth=SPEC_BAR_W*0.92;
      specCtx.beginPath();
      specCtx.moveTo(100+sn*cr,100+cs*cr);
      specCtx.lineTo(100+sn*(cr-1.0),100+cs*(cr-1.0));
      specCtx.stroke();
    }
  }
}

// ── 主循环 ──────────────────────────────────────────────────────────────
// 独立于指针的 rAF：
//   · 有真实采集 → 读频域；否则走程序化频谱；停播 → 目标归零，柱子按 release 回落
//   · 柱子上冲快、回落慢，与指针的 attack/release 同一节奏
function specVisualLoop(ts){
  const dt=specLastTs?Math.min(0.05,(ts-specLastTs)/1000):0.016;specLastTs=ts;
  const playing=!!(isPlaying&&!isMuted&&userVolume>0);
  let live=false;
  if(playing&&busAttached&&specAnalyser&&meterLive) live=readSpectrumBars();
  if(!live){
    if(playing&&!isMuted&&userVolume>0) simSpectrumBars();
    else for(let i=0;i<SPEC_BARS;i++) specTarget[i]=0;
  }
  for(let i=0;i<SPEC_BARS;i++){
    const t=specTarget[i];
    const tau=(t>specBar[i])?SPEC_ATTACK:SPEC_RELEASE;
    specBar[i]+=(t-specBar[i])*(1-Math.exp(-dt/tau));
    specCap[i]=Math.max(specBar[i],specCap[i]-SPEC_CAP_FALL*dt);
    if(specCap[i]<0) specCap[i]=0;
  }
  drawSpectrum(live);
  requestAnimationFrame(specVisualLoop);
}

function startSpectrumLoop(){
  resizeSpecCanvas();
  requestAnimationFrame(specVisualLoop);
  // 全屏切换 / 窗口缩放后重建位图（View Transitions 动画结束后再量一次）
  window.addEventListener("resize",()=>{setTimeout(resizeSpecCanvas,650);});
  setInterval(resizeSpecCanvas,900);
}

function updateClock(){const n=new Date();einkTime.textContent=`${String(n.getHours()).padStart(2,"0")}:${String(n.getMinutes()).padStart(2,"0")}`;const w=["日","一","二","三","四","五","六"];einkDate.textContent=`${n.getFullYear()}年${n.getMonth()+1}月${n.getDate()}日 星期${w[n.getDay()]}`;}

// 音量
// ════════════════════════════════════════════════════════════════════════════
const VOL_MIN_A=-135,VOL_MAX_A=135,VOL_RNG=VOL_MAX_A-VOL_MIN_A;
function volToAngle(v){return VOL_MIN_A+v*VOL_RNG;}
function setVolumeVisual(vol,smooth){
  volumeKnob.style.transition=smooth===false?"none":"transform 0.25s cubic-bezier(.4,0,.2,1)";
  volumeBar.style.transition=smooth===false?"none":"width 0.25s cubic-bezier(.4,0,.2,1)";
  volumeThumb.style.transition=smooth===false?"none":"left 0.25s cubic-bezier(.4,0,.2,1)";
  volumeKnob.style.transform=`rotate(${volToAngle(vol)}deg)`;
  volumeBar.style.width=`${vol*100}%`;
  volumeThumb.style.left=`${vol*100}%`;
  volumeValue.textContent=isMuted?"MUTE":Math.round(vol*100);
  volumeKnob.style.opacity=isMuted?"0.55":"1";
}
function setVolumeFromSlider(vol){vol=Math.max(0,Math.min(1,vol));userVolume=vol;isMuted=false;if(vol>0)lastVolCache=vol;applyOutputVolume();setVolumeVisual(vol,false);}
let sliderDragging=false;
function getVolFromPointer(x){const r=volumeSlider.getBoundingClientRect();return Math.max(0,Math.min(1,(x-r.left)/r.width));}
volumeSlider.addEventListener("mousedown",e=>{e.preventDefault();sliderDragging=true;volumeSlider.classList.add("dragging");setVolumeFromSlider(getVolFromPointer(e.clientX));});
document.addEventListener("mousemove",e=>{if(sliderDragging)setVolumeFromSlider(getVolFromPointer(e.clientX));});
document.addEventListener("mouseup",()=>{if(sliderDragging){sliderDragging=false;volumeSlider.classList.remove("dragging");}});
volumeSlider.addEventListener("touchstart",e=>{sliderDragging=true;volumeSlider.classList.add("dragging");setVolumeFromSlider(getVolFromPointer(e.touches[0].clientX));},{passive:false});
document.addEventListener("touchmove",e=>{if(sliderDragging){e.preventDefault();setVolumeFromSlider(getVolFromPointer(e.touches[0].clientX));}},{passive:false});
document.addEventListener("touchend",()=>{if(sliderDragging){sliderDragging=false;volumeSlider.classList.remove("dragging");}});
volumeKnob.addEventListener("click",()=>{if(isMuted){isMuted=false;userVolume=lastVolCache;}else{lastVolCache=userVolume;isMuted=true;}applyOutputVolume();setVolumeVisual(isMuted?0:userVolume,true);});
tuningKnob.addEventListener("click",()=>{openPanel();});

// 列表

function escapeHtml(str) {
  return String(str).replace(/[&<>"']/g, m => ({
    '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
  }[m]));
}

   视图切换
   ════════════════════════════════════════════════════════════════════════════ */
const ALL_VIEWS=[mainView,resultView];
function switchView(view){
  ALL_VIEWS.forEach(v=>v.classList.remove("active"));
  view.classList.add("active");
}
function showMainView(){
  switchView(mainView);
  panelTitle.textContent="📻 搜索电台";
  toggleAddViewBtn.textContent="📋 打开频谱表";
}
function showListView(){
  showMainView();
}
function showResultView(){
  switchView(resultView);
  panelTitle.textContent="🎯 检索结果";
  toggleAddViewBtn.textContent="";
}
function openPanel(){
  const rb=document.getElementById("radioBox"); if(rb){rb.scrollLeft=0;rb.scrollTop=0;}
  showMainView();
  sidePanel.classList.add("open");
  document.body.classList.add("panel-open");
  // 面板打开时收起皮肤弹层并隐藏工具栏，防止遮挡 ✕ 关闭按钮
  try{setSkinPop(false);clearTimeout(skinCloseTimer);}catch(_){}
  try{hideToolbar();}catch(_){}
}
function closePanel(){
  sidePanel.classList.remove("open");
  document.body.classList.remove("panel-open");
  const rb=document.getElementById("radioBox"); if(rb){rb.scrollLeft=0;rb.scrollTop=0;}
}

/* ════════════════════════════════════════════════════════════════════════════
   自定义频道列表
   ════════════════════════════════════════════════════════════════════════════ */
/* ── 源状态小圆点 ───────────────────────────────────────────────────────────
   ok=测得通 / bad=暂时屏蔽 / testing=正在测 / 灰=还没测过                    */
function dotHtml(st){
  if(!st||!st.urls||!st.urls.length) return `<span class="src-dot bad"></span>`;
  const states=st.urls.map(u=>urlState[u]||"");
  let cls="", n="";
  if(states.indexOf("ok")>=0){ cls="ok"; const k=states.filter(x=>x==="ok").length; n=k+"/"+st.urls.length; }
  else if(states.indexOf("testing")>=0){ cls="testing"; }
  else if(states.length&&states.every(x=>x==="bad")){ cls="bad"; }
  return `<span class="src-dot ${cls}"></span>`+(n?`<span class="src-n">${n}</span>`:"");
}

/* ════════════════════════════════════════════════════════════════════════════
   电台簿列表（含源状态）
   ════════════════════════════════════════════════════════════════════════════ */
function renderStationList(){
  if(!BOOK_FLAT.length){
    stationListContainer.innerHTML=`<div class="result-empty">电台簿是空的<br>点右上角「📋 频谱表」把源粘进去</div>`;
    customCount.textContent="";
    return;
  }
  stationListContainer.innerHTML=BOOK_FLAT.map((s,idx)=>{
    const a=currentStation&&currentStation.name===s.name;
    return `<div class="station-item${a?' active':''}" data-index="${idx}">
<div class="item-left">
${dotHtml(s)}
<span class="item-name">${escapeHtml(s.name)}</span>
<span class="item-tag">${escapeHtml(s.group||"电台")}</span>
</div>
<span class="src-n">${s.fm?s.fm.toFixed(1):""}</span>
</div>`;
  }).join("");
  customCount.textContent=`(${BOOK_FLAT.length})`;
  stationListContainer.querySelectorAll(".station-item").forEach(it=>{
    it.addEventListener("click",()=>{
      const st=BOOK_FLAT[+it.dataset.index];
      if(!st)return;
      playStation(st,0);
      closePanel();
    });
  });
}

   在本机电台簿里找台（不联网）

let lastQuery="";
let searchToken=0;

function searchRadio(query){
  const q=String(query||"").trim();
  if(!q) return;
  lastQuery=q; searchToken++;
  showResultView();
  resultQuery.textContent=q;
  if(!BOOK_FLAT.length){
    resultList.innerHTML=`<div class="result-empty">电台簿是空的<br>
      <small>先点右上角「📋 频谱表」录入电台源</small></div>`;
    return;
  }
  const key=q.replace(/\s+/g,"").toLowerCase();
  const fmQ=parseFloat((q.match(/\d{2,3}(?:\.\d{1,2})?/)||[])[0]);
  const hit=BOOK_FLAT.filter(s=>{
    const n=s.name.replace(/\s+/g,"").toLowerCase();
    if(n.indexOf(key)>=0) return true;
    if((s.aliases||[]).some(a=>a.replace(/\s+/g,"").toLowerCase().indexOf(key)>=0)) return true;
    if(s.group&&s.group.toLowerCase().indexOf(key)>=0) return true;
    if(fmQ&&s.fm&&Math.abs(s.fm-fmQ)<0.15) return true;
    return false;
  });
  if(!hit.length){
    resultList.innerHTML=`<div class="result-empty">电台簿里没有「${escapeHtml(q)}」<br>
      <small>换个别名试试，或去频谱表里加一台</small></div>`;
    return;
  }
  renderResult(hit,searchToken);
}

function findBuiltinSource(q){
  const key=String(q||"").replace(/\s+/g,"").toLowerCase();
  return BOOK_FLAT.find(s=>s.name.replace(/\s+/g,"").toLowerCase()===key)||
         BOOK_FLAT.find(s=>s.name.replace(/\s+/g,"").toLowerCase().indexOf(key)>=0)||null;
}

function renderResult(list,tk){
  if(tk!==searchToken)return;
  resultList.innerHTML=list.map((r,idx)=>{
    const playing=currentStation&&currentStation.name===r.name&&currentStation._group===r.group;
    return `<div class="result-item${playing?' active':''}" data-idx="${idx}">
<div class="res-left">
<span class="res-name">${escapeHtml(r.name)}</span>
<span class="res-meta">${escapeHtml(r.group||"")} · ${r.urls.length} 个源${r.fm?" · FM "+r.fm.toFixed(1):""}</span>
</div>
<span class="res-codec">${r.urls.length>1?"多源":"单源"}</span>
</div>`;
  }).join("");
  resultList.querySelectorAll(".result-item").forEach(it=>{
    it.addEventListener("click",()=>{
      const r=list[+it.dataset.idx]; if(!r)return;
      playStation(r,0);
